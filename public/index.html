<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Audio sample recorder</title>
</head>
<body>
<div id="root"></div>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  .app {
    font-family: 'Public Sans', system-ui, -apple-system, sans-serif;

    color: #1B2621;

    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));

  select, input[type=text], textarea {

    border-radius: 8px; background: #F6F4EF; color: #1B2621; font-family: inherit;
    min-height: 44px; appearance: none;
  }

    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236B6455'><path d='M5 7l5 5 5-5z'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center;

    font-family: inherit; font-size: 14px; padding: 12px 16px; border-radius: 8px;

    gap: 6px; min-height: 44px;
  }

  .btn-record { background: #A63D40; color: #fff; font-weight: 700; flex: 1; min-width: 100%; }
  .btn-record.recording { background: #8A2E30; }
  .btn-secondary { background: #F6F4EF; border: 1px solid #DCD7C9; color: #1B2621; }
  .btn-primary { background: #4A7A68; color: #fff; font-weight: 700; flex: 1; }
  .btn-wide { flex: 1; min-width: 100%; }

  /* Input level meter: amber too soft, green ideal, red too loud / clipping. */
  .meter { display: none; margin-top: 10px; }

  .meter-track { position: relative; height: 14px; border-radius: 7px; background: #E9E5DA; overflow: hidden; }
  .meter-ideal { position: absolute; top: 0; bottom: 0; background: rgba(74,122,104,0.22); }
  .meter-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 7px; transition: width 60ms linear; }
  .meter-peak { position: absolute; top: 0; bottom: 0; width: 2px; background: #1B2621; opacity: 0.6; }
  .meter.soft .meter-fill { background: #C88A2E; }
  .meter.good .meter-fill { background: #4A7A68; }
  .meter.loud .meter-fill { background: #A63D40; }
  .meter-label { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; color: #6B6455; }
  .meter.soft .meter-label b { color: #C88A2E; }
  .meter.good .meter-label b { color: #4A7A68; }
  .meter.loud .meter-label b { color: #A63D40; }
  audio { width: 100%; margin-top: 14px; }
  .confirm-box {
    font-size: 12px; color: #3D6656; background: #EEF3F0; border: 1px solid #4A7A68;
    border-radius: 8px; padding: 10px 12px; margin-top: 10px; line-height: 1.4;
  }
  .filename { font-size: 11px; color: #8A8474; margin-top: 8px; word-break: break-all; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #A63D40; display: inline-block; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 12px; color: #6B6455; border-bottom: 1px solid #DCD7C9; padding-bottom: 10px; margin-bottom: 6px;

  .takes li .t-meta { color: #8A8474; font-size: 11px; }

  .badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #FBF3E4; color: #8A6329; border: 1px solid #E6C98A; margin-left: 4px; }

  @media (max-width: 400px) {

    .app { padding-left: 0; padding-right: 0; }
    h1 { font-size: 16px; }
    .phrase-text { font-size: 18px; }
  }
</style>
<script>
// Phrase recorder v2 — see docs/data-contract.md. Everything this file
// produces (WAV, filename, manifest.json, zip) is specified there.
const APP_VERSION = "2.1.0";
const MANIFEST_VERSION = 1;
const CONSENT_TEXT_VERSION = 1;
const CONSENT_TEXT =
  "I confirm I am recording my own voice reading clinical phrases for the local " +
  "medical interpreter project. I agree these recordings may be stored on the " +
  "practice's own equipment and used to test and train its interpretation system. " +
  "No patient information is involved. I can ask for my recordings to be deleted " +
  "by quoting my speaker ID.";

const SPEAKER_TYPES = [
  { value: "native", label: "Native speaker" },
  { value: "fluent", label: "Fluent (non-native)" },
  { value: "learner", label: "Learner" },
  { value: "staff", label: "Staff / clinician" },
];
const PURPOSES = [
  { value: "asr_training", label: "ASR training (general speech)" },
  { value: "asr_test", label: "ASR test (accuracy check)" },
  { value: "tts_pronunciation", label: "TTS pronunciation reference" },
];

// ---------------------------------------------------------------------------
// Tiny DOM helper
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  });
  children.forEach((c) => c && e.appendChild(c));
  return e;
}
function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
}
function pad(n, w = 2) { return String(n).padStart(w, "0"); }
function compactUtc(d) {
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" +
    pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
}
function fmtSecs(ms) { return (ms / 1000).toFixed(1) + "s"; }
async function sha256Hex(blob) {
  const buf = await blob.arrayBuffer();
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

// ---------------------------------------------------------------------------
// Phrase list — public/phrases.json, cached for offline use.
async function loadPhraseList() {
  try {
    const r = await fetch("phrases.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    try { localStorage.setItem("phrases_cache", JSON.stringify(data)); } catch (_) {}
    return data;
  } catch (err) {
    try {
      const cached = localStorage.getItem("phrases_cache");
      if (cached) return JSON.parse(cached);
    } catch (_) {}
    throw err;
  }
}

// ---------------------------------------------------------------------------
// Session settings (localStorage) — one language + speaker per batch.
const SETTINGS_KEY = "session_v2";
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || null; } catch (_) { return null; }
}
function saveSettings(s) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (_) {}
}

// ---------------------------------------------------------------------------
// Take store (IndexedDB) — accepted takes survive reloads until exported + cleared.
const DB_NAME = "phrase_recorder", STORE = "takes";
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbAll() {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbAdd(rec) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    const req = tx.objectStore(STORE).add(rec);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(id) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}
async function dbClear() {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).clear();
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}

// ---------------------------------------------------------------------------
// Audio capture → 16-bit mono PCM WAV at the device's native rate.
function buildWavBlob(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  function writeString(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }
  writeString(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, "data");
  view.setUint32(40, samples.length * 2, true);
  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([view], { type: "audio/wav" });
}

const rec = { ctx: null, source: null, processor: null, stream: null, chunks: [], active: false, startedAt: 0, level: null };

// Level zones in dBFS of the per-buffer RMS. Speech that sits in the green band
// leaves headroom for peaks without being lost in the noise floor.
const LEVEL = { floor: -60, soft: -32, loud: -12, clip: -1 };
const dbfs = (x) => (x > 0 ? 20 * Math.log10(x) : LEVEL.floor);

function trackLevel(samples) {
  let sum = 0, peak = 0;
  for (let i = 0; i < samples.length; i++) {
    const v = samples[i], a = v < 0 ? -v : v;
    sum += v * v;
    if (a > peak) peak = a;
  }
  const L = rec.level;
  L.rms = dbfs(Math.sqrt(sum / samples.length));
  L.peak = dbfs(peak);
  L.display = Math.max(L.rms, L.display - 2.5);          // fast attack, slow release
  if (L.peak > L.takePeak) L.takePeak = L.peak;
  if (L.peak >= LEVEL.clip) L.clipped++;
  L.rmsSum += L.rms; L.n++;
}

function levelZone(db) {
  return db < LEVEL.soft ? "soft" : db > LEVEL.loud ? "loud" : "good";
}

async function startCapture() {
  rec.chunks = [];
  rec.level = { rms: LEVEL.floor, peak: LEVEL.floor, display: LEVEL.floor, takePeak: LEVEL.floor, clipped: 0, rmsSum: 0, n: 0 };
  // Raw audio for dataset collection — no browser-side processing where the platform honours it.
  rec.stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  });
  rec.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (rec.ctx.state === "suspended") await rec.ctx.resume();
  rec.source = rec.ctx.createMediaStreamSource(rec.stream);
  // ScriptProcessorNode is deprecated but is the one path that works on every
  // phone browser we care about (incl. iOS Safari) without a separate worklet file.
  rec.processor = rec.ctx.createScriptProcessor(4096, 1, 1);
  rec.processor.onaudioprocess = (e) => {
    const samples = new Float32Array(e.inputBuffer.getChannelData(0));
    rec.chunks.push(samples);
    trackLevel(samples);
  };
  rec.source.connect(rec.processor);
  rec.processor.connect(rec.ctx.destination);
  rec.active = true;
  rec.startedAt = Date.now();
}

function stopCapture() {
  rec.active = false;
  rec.processor.disconnect();
  rec.source.disconnect();
  rec.stream.getTracks().forEach((t) => t.stop());
  const total = rec.chunks.reduce((n, c) => n + c.length, 0);
  const merged = new Float32Array(total);
  let off = 0;
  rec.chunks.forEach((c) => { merged.set(c, off); off += c.length; });
  const sampleRate = rec.ctx.sampleRate;
  rec.ctx.close();
  rec.chunks = [];
  const L = rec.level;
  return {
    blob: buildWavBlob(merged, sampleRate),
    sampleRate,
    durationMs: Math.round((merged.length / sampleRate) * 1000),
    recordedAt: new Date(rec.startedAt),
    level: { rms_dbfs: Math.round(L.n ? L.rmsSum / L.n : LEVEL.floor), peak_dbfs: Math.round(L.takePeak), clipped: L.clipped },
  };
}

// ---------------------------------------------------------------------------
// Store-only ZIP writer (no compression — WAV barely compresses, and it keeps
// this file dependency-free). Layout per docs/data-contract.md §6.
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function dosDateTime(d) {
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  return { time, date };
}
// entries: [{ name, bytes: Uint8Array }]
function buildZip(entries) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = dosDateTime(new Date());
  for (const { name, bytes } of entries) {
    const nameBytes = enc.encode(name);
    const crc = crc32(bytes);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);          // version needed
    local.setUint16(6, 0x0800, true);      // flags: UTF-8 names
    local.setUint16(8, 0, true);           // method: store
    local.setUint16(10, now.time, true);
    local.setUint16(12, now.date, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, bytes.length, true);
    local.setUint32(22, bytes.length, true);
    local.setUint16(26, nameBytes.length, true);
    local.setUint16(28, 0, true);
    parts.push(local.buffer, nameBytes, bytes);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, now.time, true);
    cd.setUint16(14, now.date, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, bytes.length, true);
    cd.setUint32(24, bytes.length, true);
    cd.setUint16(28, nameBytes.length, true);
    cd.setUint16(30, 0, true);
    cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true);
    cd.setUint16(36, 0, true);
    cd.setUint32(38, 0, true);
    cd.setUint32(42, offset, true);
    central.push(cd.buffer, nameBytes);
    offset += 30 + nameBytes.length + bytes.length;
  }
  const cdSize = central.reduce((n, b) => n + b.byteLength, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(4, 0, true);
  eocd.setUint16(6, 0, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, offset, true);
  eocd.setUint16(20, 0, true);
  return new Blob([...parts, ...central, eocd.buffer], { type: "application/zip" });
}

// ---------------------------------------------------------------------------
// Batch export — manifest.json + WAVs → zip (docs/data-contract.md §5–6).
function phraseIdPart(meta) {
  return meta.unmatched ? "UNASSIGNED_" + slugify(meta.phrase_text).slice(0, 40) : meta.phrase_key + "v" + meta.phrase_version;
}
function phraseId(p) { return p.unmatched ? "adhoc:" + p.text : p.key + "v" + p.version; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
// How the phrase should be presented for this language:
//   canonical – English session: read the phrase as written
//   adhoc     – volunteer-added phrase: read what they typed
//   approved  – an approved translation exists: read that
//   ask       – no translation yet: read the English, optionally type the translation
function readMode(p, lang) {
  if (p.unmatched) return { kind: "adhoc" };
  if (lang === "en") return { kind: "canonical" };
  const t = (p.translations || {})[lang];
  return t ? { kind: "approved", text: t } : { kind: "ask" };
}

async function buildBatch(settings, takes) {
  const exportedAt = new Date();
  const batchId = compactUtc(exportedAt) + "_" + settings.speakerId + "_" + settings.language + "_" +
    Math.random().toString(36).slice(2, 8);
  const manifest = {
    manifest_version: MANIFEST_VERSION,
    app_version: APP_VERSION,
    batch_id: batchId,
    exported_at: exportedAt.toISOString(),
    language: settings.language,
    speaker: {
      id: settings.speakerId,
      type: settings.speakerType,
      consent_confirmed: !!settings.consent,
      consent_text_version: CONSENT_TEXT_VERSION,
    },
    device: { user_agent: navigator.userAgent, sample_rate: takes[0] ? takes[0].meta.sample_rate : null },
    recordings: takes.map((t) => t.meta),
  };
  const entries = [{ name: "manifest.json", bytes: new TextEncoder().encode(JSON.stringify(manifest, null, 2)) }];
  for (const t of takes) entries.push({ name: t.meta.file, bytes: new Uint8Array(await t.blob.arrayBuffer()) });
  return { blob: buildZip(entries), name: "batch_" + batchId + ".zip", manifest };
}

// ---------------------------------------------------------------------------
// App
async function App(root) {
  const container = el("div", { class: "app" });
  const card = el("div", { class: "card" });
  container.appendChild(card);
  root.appendChild(container);

  let phraseData;
  try {
    phraseData = await loadPhraseList();
  } catch (err) {
    card.appendChild(el("h1", { text: "Audio sample recorder" }));
    card.appendChild(el("div", { class: "err-box", text: "Couldn't load the phrase list (" + err.message + "). Check your connection and reload." }));
    return;
  }

  const state = {
    settings: loadSettings(),
    takes: await dbAll(),
    screen: "setup",
    // recording screen
    sessionPhrases: [],   // [{ key, version, text, category, unmatched }]
    idx: 0,
    pending: null,        // { blob, sampleRate, durationMs, recordedAt } awaiting accept
    typed: {},            // phraseId -> translation typed this session (so take 2 needn't retype)
    pendingUrl: null,
    timer: null,
    // batch screen
    zip: null,            // { blob, name, manifest } pre-built so share() runs inside the tap
    exported: false,
  };
  if (state.settings && state.settings.consent && state.takes.length) state.screen = "record";

  function render() {
    card.innerHTML = "";
    if (state.screen === "setup") renderSetup();
    else if (state.screen === "record") renderRecord();
    else renderBatch();
  }

  // ---- Setup ---------------------------------------------------------------
  function renderSetup() {
    const s = state.settings || {
      language: (phraseData.languages.find((l) => l.code === "en") || phraseData.languages[0]).code, speakerId: "", speakerType: "native",
      purpose: "asr_training", category: "obstetric_emergency", consent: false,
    };
    const locked = state.takes.length > 0;

    card.appendChild(el("h1", { text: "Audio sample recorder" }));
    card.appendChild(el("div", { class: "sub", text: "Records on this device only. Nothing is uploaded — when you've finished, you'll export one file and send it to the project." }));

    if (locked) {
      card.appendChild(el("div", { class: "warn-box", text:
        state.takes.length + " recording(s) are waiting in a batch for " + s.speakerId + " / " + s.language.toUpperCase() +
        ". Language and speaker are locked until that batch is exported and cleared." }));
    }

    const langSel = el("select", { disabled: locked });
    phraseData.languages.forEach((l) => langSel.appendChild(el("option", { value: l.code, text: l.label })));
    langSel.value = s.language;

    const speakerInput = el("input", { type: "text", placeholder: "e.g. mg or nurse3", maxlength: "12", autocapitalize: "none", autocomplete: "off", disabled: locked, value: s.speakerId });
    const speakerTypeSel = el("select");
    SPEAKER_TYPES.forEach((t) => speakerTypeSel.appendChild(el("option", { value: t.value, text: t.label })));
    speakerTypeSel.value = s.speakerType;

    const purposeSel = el("select");
    PURPOSES.forEach((p) => purposeSel.appendChild(el("option", { value: p.value, text: p.label })));
    purposeSel.value = s.purpose;

    const catSel = el("select");
    phraseData.categories.forEach((c) => {
      const n = phraseData.phrases.filter((p) => p.category === c.slug).length;
      catSel.appendChild(el("option", { value: c.slug, text: c.label + (n ? " (" + n + ")" : " (none yet)") }));
    });
    catSel.value = s.category;

    const consentCb = el("input", { type: "checkbox", id: "consent" });
    consentCb.checked = !!s.consent;
    const consentBox = el("label", { class: "consent", for: "consent" }, [consentCb, el("span", { text: CONSENT_TEXT })]);

    const errBox = el("div", { class: "err-box", style: "display:none" });
    const startBtn = el("button", { class: "btn-primary btn-wide", text: locked ? "Continue recording" : "Start recording session" });

    card.appendChild(el("label", { text: "Language being recorded" }));
    card.appendChild(langSel);
    card.appendChild(el("label", { text: "Speaker ID" }));
    card.appendChild(speakerInput);
    card.appendChild(el("div", { class: "hint", text: "Initials or a nickname, 2–12 letters/digits. Not your full name — it goes into filenames." }));
    card.appendChild(el("label", { text: "Speaker" }));
    card.appendChild(speakerTypeSel);
    card.appendChild(el("label", { text: "Purpose" }));
    card.appendChild(purposeSel);
    card.appendChild(el("label", { text: "Category to work through" }));
    card.appendChild(catSel);
    card.appendChild(consentBox);
    card.appendChild(errBox);
    card.appendChild(el("div", { class: "row" }, [startBtn]));
    if (locked) {
      card.appendChild(el("div", { class: "row tight" }, [
        el("button", { class: "btn-link", text: "Review / export the waiting batch", onclick: () => { state.screen = "batch"; render(); } }),
      ]));
    }

    startBtn.addEventListener("click", () => {
      const speakerId = speakerInput.value.trim().toLowerCase();
      const problems = [];
      if (!/^[a-z0-9]{2,12}$/.test(speakerId)) problems.push("Speaker ID must be 2–12 lower-case letters or digits.");
      if (!consentCb.checked) problems.push("Please tick the consent box to continue.");
      if (problems.length) { errBox.textContent = problems.join(" "); errBox.style.display = "block"; return; }
      state.settings = {
        language: langSel.value, speakerId, speakerType: speakerTypeSel.value,
        purpose: purposeSel.value, category: catSel.value, consent: true,
      };
      saveSettings(state.settings);
      startSession();
    });
  }

  function startSession() {
    const cat = state.settings.category;
    state.sessionPhrases = phraseData.phrases.filter((p) => p.category === cat)
      .map((p) => ({ key: p.key, version: p.version, text: p.text, category: cat, unmatched: false, translations: p.translations || {} }));
    state.idx = 0;
    discardPending();
    state.screen = "record";
    render();
  }

  // ---- Record --------------------------------------------------------------
  function takesFor(p) {
    return state.takes.filter((t) => p.unmatched
      ? t.meta.unmatched && t.meta.phrase_text === p.text
      : t.meta.phrase_key === p.key && t.meta.phrase_version === p.version);
  }
  function discardPending() {
    if (state.pendingUrl) URL.revokeObjectURL(state.pendingUrl);
    state.pending = null; state.pendingUrl = null;
  }

  function renderRecord() {
    const s = state.settings;
    if (!state.sessionPhrases.length) startSessionPhrasesOnly();
    const p = state.sessionPhrases[state.idx];
    const catLabel = (phraseData.categories.find((c) => c.slug === s.category) || {}).label || s.category;
    const langLabel = (phraseData.languages.find((l) => l.code === s.language) || {}).label || s.language.toUpperCase();
    const mode = p ? readMode(p, s.language) : { kind: "none" };

    card.appendChild(el("div", { class: "session-bar" }, [
      el("span", { class: "meta", text: s.language.toUpperCase() + " · " + s.speakerId + " · " + catLabel }),
      el("button", { class: "btn-link", text: "Change", onclick: () => { discardPending(); state.screen = "setup"; render(); } }),
    ]));

    if (!p) {
      card.appendChild(el("h2", { text: "No phrases in this category yet" }));
      card.appendChild(el("div", { class: "hint", text: "Add a phrase below, or change category." }));
    } else {
      const existing = takesFor(p).length;
      card.appendChild(el("div", { class: "progress", text: "Phrase " + (state.idx + 1) + " of " + state.sessionPhrases.length + (existing ? " · " + existing + " take" + (existing > 1 ? "s" : "") + " saved" : "") }));
      if (mode.kind === "approved") {
        // Approved target-language text exists: read that; English shown for reference.
        card.appendChild(el("div", { class: "phrase-text", lang: s.language, text: mode.text }));
        card.appendChild(el("div", { class: "phrase-source", html: "<b>English:</b> " + esc(p.text) }));
      } else {
        card.appendChild(el("div", { class: "phrase-text", text: p.text }));
      }
      card.appendChild(el("div", { class: "phrase-key", text: p.unmatched ? "Not in the approved list — will be exported as UNASSIGNED" : p.key + " v" + p.version + (mode.kind === "approved" ? " · approved " + langLabel + " translation" : "") }));
    }

    // Non-English, no approved translation yet: let the volunteer type what they'll read.
    const translationBox = el("div", { style: mode.kind === "ask" ? "" : "display:none" });
    const translationInput = el("textarea", { placeholder: "Type the " + langLabel + " you're about to say (optional)" });
    if (mode.kind === "ask") {
      translationInput.value = state.typed[phraseId(p)] || (takesFor(p).slice(-1)[0] || { meta: {} }).meta.read_text || "";
      translationBox.appendChild(el("label", { text: "Your " + langLabel + " translation" }));
      translationBox.appendChild(translationInput);
      translationBox.appendChild(el("div", { class: "hint", text: "This becomes a draft translation for review. Leave it blank if you'd rather not type — the recording is still saved and the text can be added later." }));
      translationInput.addEventListener("input", () => { state.typed[phraseId(p)] = translationInput.value; });
    }
    card.appendChild(translationBox);

    const recordBtn = el("button", { class: "btn-record", disabled: !p });
    const status = el("div", { class: "status" });
    const meterFill = el("div", { class: "meter-fill" });
    const meterPeak = el("div", { class: "meter-peak", style: "left:0" });
    const meterZone = el("b", { text: "" });
    const pct = (db) => Math.max(0, Math.min(100, ((db - LEVEL.floor) / -LEVEL.floor) * 100));
    const meter = el("div", { class: "meter" }, [
      el("div", { class: "meter-track" }, [
        el("div", { class: "meter-ideal", style: "left:" + pct(LEVEL.soft) + "%; width:" + (pct(LEVEL.loud) - pct(LEVEL.soft)) + "%" }),
        meterFill, meterPeak,
      ]),
      el("div", { class: "meter-label" }, [el("span", { text: "Mic level — keep it in the green" }), meterZone]),
    ]);
    let meterRaf = 0;
    function paintMeter() {
      if (!rec.active) { meter.className = "meter"; return; }
      const L = rec.level, zone = levelZone(L.display);
      meterFill.style.width = pct(L.display) + "%";
      meterPeak.style.left = pct(L.takePeak) + "%";
      meter.className = "meter on " + zone;
      meterZone.textContent = (zone === "soft" ? "Too soft — come closer" : zone === "loud" ? "Too loud — back off" : "Good")
        + (L.clipped ? " · clipped, redo this take" : "");
      meterRaf = requestAnimationFrame(paintMeter);
    }
    const audioPreview = el("audio", { controls: true, style: "display:none" });
    const confirmBox = el("div", { class: "confirm-box", style: "display:none" });
    const filenameNote = el("div", { class: "filename" });
    const acceptRow = el("div", { class: "row", style: "display:none" });
    const acceptBtn = el("button", { class: "btn-primary", text: "Accept & next" });
    const redoBtn = el("button", { class: "btn-secondary", text: "Redo" });
    acceptRow.appendChild(acceptBtn); acceptRow.appendChild(redoBtn);

    const navRow = el("div", { class: "row tight" });
    const prevBtn = el("button", { class: "btn-secondary", text: "‹ Prev", disabled: state.idx === 0 });
    const skipBtn = el("button", { class: "btn-secondary", text: "Skip ›", disabled: !p || state.idx >= state.sessionPhrases.length - 1 });
    navRow.appendChild(prevBtn); navRow.appendChild(skipBtn);

    const addRow = el("div", { class: "row phrase-new-row", style: "display:none" });
    const addInput = el("input", { type: "text", placeholder: "Type the phrase exactly as it should be read" });
    const addConfirm = el("button", { class: "btn-secondary", text: "Use this phrase" });
    addRow.appendChild(addInput); addRow.appendChild(addConfirm);
    const addToggle = el("button", { class: "btn-link", text: "+ Add a phrase that isn't in the list" });

    const batchRow = el("div", { class: "row" });
    const batchBtn = el("button", { class: "btn-secondary btn-wide", text: state.takes.length ? "Review & export batch (" + state.takes.length + ")" : "Batch is empty" , disabled: !state.takes.length });
    batchRow.appendChild(batchBtn);

    card.appendChild(el("div", { class: "row" }, [recordBtn]));
    card.appendChild(status);
    card.appendChild(meter);
    card.appendChild(audioPreview);
    card.appendChild(confirmBox);
    card.appendChild(filenameNote);
    card.appendChild(acceptRow);
    card.appendChild(navRow);
    card.appendChild(el("div", { class: "row tight" }, [addToggle]));
    card.appendChild(addRow);
    card.appendChild(batchRow);

    function paint() {
      if (rec.active) {
        recordBtn.className = "btn-record recording";
        recordBtn.innerHTML = "&#9632; Stop";
        status.className = "status live";
        status.innerHTML = '<span class="dot"></span> Recording… ' + fmtSecs(Date.now() - rec.startedAt);
      } else {
        recordBtn.className = "btn-record";
        recordBtn.innerHTML = state.pending ? "&#9679; Record again" : "&#9679; Start recording";
        status.className = "status";
      }
    }

    recordBtn.addEventListener("click", async () => {
      if (!rec.active) {
        try {
          discardPending();
          audioPreview.style.display = "none"; confirmBox.style.display = "none"; acceptRow.style.display = "none"; filenameNote.textContent = "";
          await startCapture();
          paint();
          paintMeter();
          state.timer = setInterval(paint, 200);
        } catch (err) {
          status.className = "status"; status.textContent = "Microphone access denied or unavailable.";
        }
      } else {
        clearInterval(state.timer);
        cancelAnimationFrame(meterRaf);
        const result = stopCapture();
        paint(); paintMeter();
        if (result.durationMs < 300) { status.textContent = "That was too short — try again."; return; }
        state.pending = result;
        state.pendingUrl = URL.createObjectURL(result.blob);
        audioPreview.src = state.pendingUrl; audioPreview.style.display = "block";
        status.textContent = "Listen back, then accept or redo.";
        confirmBox.style.display = "block";
        const said = mode.kind === "approved" ? mode.text : (mode.kind === "ask" && translationInput.value.trim()) || p.text;
        const lv = result.level;
        const levelNote = lv.clipped ? " — CLIPPED " + lv.clipped + " time(s), please redo further from the mic"
          : lv.rms_dbfs < LEVEL.soft ? " — quiet take, consider redoing closer to the mic" : "";
        confirmBox.textContent = "Check it matches: “" + said + "”  (" + fmtSecs(result.durationMs) + ", " + result.sampleRate + " Hz, peak " + lv.peak_dbfs + " dBFS" + levelNote + ")";
        acceptRow.style.display = "flex";
      }
    });

    redoBtn.addEventListener("click", () => recordBtn.click());

    acceptBtn.addEventListener("click", async () => {
      if (!state.pending) return;
      acceptBtn.disabled = true; redoBtn.disabled = true;
      const r = state.pending;
      const take = takesFor(p).length + 1;
      const base = { phrase_key: p.unmatched ? null : p.key, phrase_version: p.unmatched ? null : p.version, phrase_text: p.text, unmatched: p.unmatched };
      const file = [phraseIdPart(base), s.language, p.category, s.purpose, s.speakerId, "t" + take, r.recordedAt.getTime()].join("_") + ".wav";
      // What was actually read. Never the English by default for a non-English take.
      let read_text = null, translation_source = null;
      if (mode.kind === "canonical") { read_text = p.text; translation_source = "canonical"; }
      else if (mode.kind === "approved") { read_text = mode.text; translation_source = "approved"; }
      else if (mode.kind === "ask" && translationInput.value.trim()) { read_text = translationInput.value.trim(); translation_source = "typed"; }
      else if (mode.kind === "adhoc") { read_text = p.text; translation_source = "typed"; }
      const meta = {
        file, ...base, category: p.category, purpose: s.purpose, take,
        read_text, translation_source,
        sample_rate: r.sampleRate, duration_ms: r.durationMs, bytes: r.blob.size,
        sha256: await sha256Hex(r.blob), recorded_at: r.recordedAt.toISOString(),
        level: r.level,
      };
      const id = await dbAdd({ meta, blob: r.blob });
      state.takes.push({ id, meta, blob: r.blob });
      discardPending();
      if (state.idx < state.sessionPhrases.length - 1) state.idx++;
      render();
    });

    prevBtn.addEventListener("click", () => { discardPending(); state.idx--; render(); });
    skipBtn.addEventListener("click", () => { discardPending(); state.idx++; render(); });

    addToggle.addEventListener("click", () => { addRow.style.display = addRow.style.display === "none" ? "flex" : "none"; if (addRow.style.display === "flex") addInput.focus(); });
    addConfirm.addEventListener("click", () => {
      const text = addInput.value.trim();
      if (text.length < 3) return;
      discardPending();
      state.sessionPhrases.push({ key: null, version: null, text, category: s.category, unmatched: true });
      state.idx = state.sessionPhrases.length - 1;
      render();
    });

    batchBtn.addEventListener("click", () => { discardPending(); state.screen = "batch"; render(); });
    paint();
  }

  // When we land on the record screen from a reload with takes waiting.
  function startSessionPhrasesOnly() {
    const cat = state.settings.category;
    state.sessionPhrases = phraseData.phrases.filter((p) => p.category === cat)
      .map((p) => ({ key: p.key, version: p.version, text: p.text, category: cat, unmatched: false, translations: p.translations || {} }));
    // Re-surface any unmatched phrases already recorded so they show in the list.
    state.takes.filter((t) => t.meta.unmatched && t.meta.category === cat).forEach((t) => {
      if (!state.sessionPhrases.some((p) => p.unmatched && p.text === t.meta.phrase_text))
        state.sessionPhrases.push({ key: null, version: null, text: t.meta.phrase_text, category: cat, unmatched: true });
    });
    state.idx = 0;
  }

  // ---- Batch ---------------------------------------------------------------
  function renderBatch() {
    const s = state.settings;
    state.zip = null;

    card.appendChild(el("div", { class: "session-bar" }, [
      el("span", { class: "meta", text: s.language.toUpperCase() + " · " + s.speakerId + " · batch" }),
      el("button", { class: "btn-link", text: "‹ Back to recording", onclick: () => { state.screen = "record"; render(); } }),
    ]));
    card.appendChild(el("h2", { text: state.takes.length + " recording" + (state.takes.length === 1 ? "" : "s") + " in this batch" }));

    const list = el("ul", { class: "takes" });
    const player = el("audio", { controls: true, style: "display:none" });
    state.takes.forEach((t) => {
      const li = el("li");
      const main = el("div", { class: "t-main" });
      main.appendChild(el("div", { class: "t-phrase", html: (t.meta.unmatched ? '<span class="badge">UNASSIGNED</span> ' : "<b>" + t.meta.phrase_key + "v" + t.meta.phrase_version + "</b> ") + t.meta.phrase_text.replace(/</g, "&lt;") }));
      main.appendChild(el("div", { class: "t-meta", text: "take " + t.meta.take + " · " + fmtSecs(t.meta.duration_ms) + " · " + Math.round(t.meta.bytes / 1024) + " KB" }));
      li.appendChild(main);
      li.appendChild(el("button", { class: "btn-secondary", text: "▶", onclick: () => { player.src = URL.createObjectURL(t.blob); player.style.display = "block"; player.play(); } }));
      li.appendChild(el("button", { class: "btn-secondary", text: "✕", onclick: async () => { await dbDelete(t.id); state.takes = state.takes.filter((x) => x.id !== t.id); render(); } }));
      list.appendChild(li);
    });
    card.appendChild(list);
    card.appendChild(player);

    const status = el("div", { class: "status", text: state.takes.length ? "Preparing export…" : "Nothing to export yet." });
    const exportBtn = el("button", { class: "btn-primary btn-wide", text: "Export batch", disabled: true });
    const sizeNote = el("div", { class: "filename" });
    const clearRow = el("div", { class: "row tight", style: "display:none" });
    const clearBtn = el("button", { class: "btn-danger-link", text: "Batch is safely on the Mac — clear it from this phone" });
    clearRow.appendChild(clearBtn);

    card.appendChild(status);
    card.appendChild(el("div", { class: "row" }, [exportBtn]));
    card.appendChild(sizeNote);
    card.appendChild(clearRow);
    card.appendChild(el("div", { class: "footer-note", text:
      "Export produces one .zip (WAVs + manifest.json). On iPhone, use the share sheet to AirDrop it straight to the Mac; " +
      "otherwise it saves to your Downloads / Files. Keep the batch here until you know it arrived." }));

    if (!state.takes.length) return;

    // Pre-build the zip so the share sheet can open synchronously inside the tap.
    buildBatch(s, state.takes).then((z) => {
      state.zip = z;
      sizeNote.textContent = z.name + " · " + (z.blob.size / (1024 * 1024)).toFixed(1) + " MB";
      status.textContent = "Ready to export.";
      exportBtn.disabled = false;
    }).catch((err) => { status.textContent = "Couldn't build the export: " + err.message; });

    exportBtn.addEventListener("click", async () => {
      const z = state.zip;
      if (!z) return;
      const file = new File([z.blob], z.name, { type: "application/zip" });
      let shared = false;
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: z.name });
          shared = true;
        } catch (err) {
          if (err && err.name === "AbortError") { status.textContent = "Share cancelled."; return; }
          // fall through to download
        }
      }
      if (!shared) {
        const url = URL.createObjectURL(z.blob);
        const a = document.createElement("a");
        a.href = url; a.download = z.name; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }
      state.exported = true;
      status.textContent = shared ? "Shared. Once it's on the Mac, clear the batch below." : "Download started. Once it's on the Mac, clear the batch below.";
      clearRow.style.display = "flex";
    });

    clearBtn.addEventListener("click", async () => {
      await dbClear();
      state.takes = [];
      state.exported = false;
      state.screen = "setup";
      render();
    });
  }

  render();
}

App(document.getElementById("root"));
</script>
</body>
</html>
