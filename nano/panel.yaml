# Everything the screen shows comes from GET /phrases on the Nano (see nano/panel_api.py).
globals:
  - {id: src_idx,    type: int, restore_value: true, initial_value: '-1'}   # "I speak" language (index into lang_codes)
  - {id: dst_idx,    type: int, restore_value: true, initial_value: '-1'}   # "Translate to" language
  - {id: src_code,   type: std::string, initial_value: '"en"'}
  - {id: lang_code,  type: std::string, initial_value: '"en"'}             # = dst: what the Nano speaks / listens for
  - {id: lang_step,  type: int, initial_value: '0'}                         # wizard: 0 = choosing src, 1 = choosing dst
  - {id: turn,       type: int, initial_value: '0'}                         # 0 = clinician ("I speak") talking, 1 = patient
  - {id: nano_base,  type: std::string, initial_value: '"${nano_url}"'}     # set from the SSID on connect
  - {id: nano_ok,    type: bool, initial_value: 'false'}
  - {id: polling,    type: bool, initial_value: 'false'}
  - {id: need_load,  type: bool, initial_value: 'false'}                    # phrase reload requested; a timer runs it
  - {id: last_tap,   type: uint32_t, initial_value: '0'}
  - {id: cat_filter, type: std::string, initial_value: '""'}               # "" = all categories
  - {id: page,       type: int, initial_value: '0'}
  - {id: recording,  type: bool, initial_value: 'false'}
  - {id: lang_codes, type: 'std::vector<std::string>'}
  - {id: lang_names, type: 'std::vector<std::string>'}
  - {id: cat_slugs,  type: 'std::vector<std::string>'}
  - {id: ph_keys,    type: 'std::vector<std::string>'}            # all phrases, in phrases.json order
  - {id: ph_texts,   type: 'std::vector<std::string>'}            # English (the canonical text)
  - {id: ph_src,     type: 'std::vector<std::string>'}            # text in the "I speak" language ("" if none)
  - {id: ph_trans,   type: 'std::vector<std::string>'}            # text in the "Translate to" language ("" if none)
  - {id: ph_draft,   type: 'std::vector<std::string>'}            # unverified machine translation ("" if none)
  - {id: last_used,  type: int, initial_value: '-1'}               # phrase index whose card wears the language colour
  - {id: cur_phrase, type: int, initial_value: '-1'}               # phrase shown on the patient page
  - {id: replies,    type: 'std::vector<int>'}                    # phrase indices in category patient_replies
  - {id: ui_reply,   type: int, initial_value: '-1'}               # index of the "Tap to reply" phrase (p020)
  - {id: ui_stop,    type: int, initial_value: '-1'}               # "Stop" (p021)
  - {id: ui_again,   type: int, initial_value: '-1'}               # "Reply again" (p022)
  - {id: ui_hear,    type: int, initial_value: '-1'}               # "Hear it again" (p023)
  - {id: rec_started, type: uint32_t, initial_value: '0'}          # millis() when the patient reply started
  - {id: phrase_url,  type: std::string, initial_value: '""'}
  - {id: replies_url, type: std::string, initial_value: '""'}
  - {id: mic_url,     type: std::string, initial_value: '""'}
  - {id: need_images, type: bool, initial_value: 'false'}                   # fetch patient-page images (from the timer, never inside a response)
  - {id: need_mic,    type: bool, initial_value: 'false'}
  - {id: need_heard,  type: bool, initial_value: 'false'}
  - {id: ph_cats,    type: 'std::vector<std::string>'}
  - {id: ph_rec,     type: 'std::vector<bool>'}
  - {id: shown,      type: 'std::vector<int>'}                    # indices of the phrases on the current page
  - {id: rec_mode,   type: bool, initial_value: 'false'}           # false = Speak, true = Record (volunteer takes)
  - {id: spk_id,     type: std::string, initial_value: '""'}
  - {id: spk_type,   type: std::string, initial_value: '"native"'}
  - {id: consented,  type: bool, initial_value: 'false'}
  - {id: rec_phrase, type: int, initial_value: '-1'}               # phrase index being recorded, or -1
  - {id: want_rec,   type: int, initial_value: '-1'}               # phrase queued by "Record it" until Record mode is on
  - {id: last_phrase, type: int, initial_value: '-1'}              # phrase index of the last tap (for the offer)
  - {id: lang_page,  type: int, initial_value: '0'}                # wizard: which 20 languages are on screen
  - {id: add_recording, type: bool, initial_value: 'false'}        # "Add phrase" page: the mic is live
  - {id: add_file,   type: std::string, initial_value: '""'}       # the take behind the text in the box (Nano tmp name)
  - {id: add_lang_codes, type: 'std::vector<std::string>'}         # "Add a language" dropdown → codes
  - {id: need_langs,  type: bool, initial_value: 'false'}                   # re-fetch /admin/languages (from the timer)
  - {id: wifi_ssids, type: 'std::vector<std::string>'}                       # Wi-Fi page: the Nano's known networks
  - {id: wifi_target, type: std::string, initial_value: '""'}                # the one just chosen
  - {id: beacon_at,  type: uint32_t, initial_value: '0'}                     # millis() of the last beacon from the Nano
  - {id: wifi_follow, type: std::string, initial_value: '""'}                # last "moving_to" acted on (once per move)
  - {id: need_follow, type: bool, initial_value: 'false'}                    # follow the Nano (from the timer, not the UDP callback)
  - {id: h_speech,   type: bool, initial_value: 'false'}                     # health flags carried by the beacon
  - {id: h_translator, type: bool, initial_value: 'false'}
  - {id: h_db,       type: bool, initial_value: 'false'}

lvgl:
  displays: [waveshare_display]
  touchscreens: [waveshare_touch]
  buffer_size: 25%
  theme:
    button:
      radius: 14
      bg_color: "${c_panel}"
      border_color: "${c_sage}"
      border_width: 2
      text_color: "${c_ink}"
      text_font: ui_22
      shadow_width: 0
      pressed:
        bg_color: "${c_sage_soft}"
    dropdown:
      bg_color: "${c_panel}"
      border_color: "${c_line}"
      border_width: 1
      radius: 10
      text_color: "${c_ink}"
      text_font: ui_18
  pages:
    # ================= 1. start =================
    - id: page_start
      bg_color: "${c_base}"
      widgets:
        - label: {align: TOP_LEFT, x: 16, y: 14, text_font: ui_22, text_color: "${c_ink}", text: "Phrase Recorder"}
        - label: {id: status_lbl, align: TOP_RIGHT, x: -16, y: 18, text_font: ui_18, text_color: "${c_muted}", text: "Wi-Fi: connecting…"}
        - button:
            id: shutdown_btn
            align: BOTTOM_RIGHT
            x: -16
            y: -12
            width: 200
            height: 44
            pad_all: 0
            border_color: "${c_line}"
            widgets: [{label: {id: shutdown_lbl, align: CENTER, text_font: ui_14, text_color: "${c_muted}", text: "hold to shut down the Nano"}}]
            on_long_press:
              - lambda: 'lv_label_set_text(id(shutdown_lbl), "shutting down…");'
              - http_request.post:
                  request_headers: {Authorization: "Bearer ${panel_token}"}
                  url: !lambda return id(nano_base) + "/panel/shutdown";
                  on_response:
                    - lambda: 'lv_label_set_text(id(shutdown_lbl), "Nano is shutting down — unplug it in 20 s"); id(nano_ok) = false;'
                  on_error:
                    - lambda: 'lv_label_set_text(id(shutdown_lbl), "Nano not reachable");'
        - button:
            align: CENTER
            y: -40
            width: 560
            height: 190
            bg_color: "${c_sage}"
            border_width: 0
            radius: 24
            pressed: {bg_color: "0x3B6354"}
            widgets:
              - label: {align: CENTER, y: -14, text_font: ui_28, text_color: "${c_panel}", text: "I speak…"}
              - label: {align: CENTER, y: 30, text_font: ui_18, text_color: "0xD8E6DF", text: "tap to choose the languages"}
            on_click:
              - lambda: 'id(lang_step) = 0; id(show_langs).execute();'
        - button:
            align: BOTTOM_LEFT
            x: 16
            y: -12
            width: 200
            height: 44
            pad_all: 0
            border_color: "${c_line}"
            widgets: [{label: {align: CENTER, text_font: ui_14, text_color: "${c_muted}", text: "Wi-Fi — move the Nano"}}]
            on_click:
              - lambda: 'id(wifi_open).execute();'
        - button:
            id: resume_btn
            align: CENTER
            y: 120
            width: 560
            height: 64
            hidden: true
            widgets:
              - label: {id: resume_lbl, align: CENTER, text_font: ui_18, text: ""}
            on_click:
              - lambda: 'id(apply_pair).execute();'
    # ================= 2b. "Translate to…" — its own screen so the step is unmistakable ==========
    - id: page_to
      bg_color: "${c_base}"
      widgets:
        - label: {align: TOP_LEFT, x: 16, y: 14, text_font: ui_22, text_color: "${c_ink}", text: "Phrase Recorder"}
        - obj: {id: to_src_chip, align: TOP_RIGHT, x: -16, y: 10, width: 220, height: 44, bg_color: "${c_sage}", border_width: 0, radius: 12, pad_all: 0,
                widgets: [{label: {id: to_src_lbl, align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "I speak English"}}]}
        - button:
            align: CENTER
            y: -40
            width: 560
            height: 190
            bg_color: "${c_steel}"
            border_width: 0
            radius: 24
            pressed: {bg_color: "0x56698A"}
            widgets:
              - label: {align: CENTER, y: -14, text_font: ui_28, text_color: "${c_panel}", text: "Translate to…"}
              - label: {align: CENTER, y: 30, text_font: ui_18, text_color: "0xDCE2EC", text: "tap to choose the patient's language"}
            on_click:
              - lambda: 'id(lang_step) = 1; id(show_langs).execute();'
        - button:
            align: CENTER
            y: 120
            width: 560
            height: 64
            widgets: [{label: {align: CENTER, text_font: ui_18, text: "Back — change the language I speak"}}]
            on_click:
              - lambda: 'id(lang_step) = 0; id(show_langs).execute();'
    # ================= 2/3. pick a language (used for both steps) =================
    - id: page_lang
      bg_color: "${c_base}"
      widgets:
        - label: {id: lang_title, align: TOP_LEFT, x: 16, y: 8, text_font: ui_28, text_color: "${c_sage}", text: "I speak"}
        - label: {id: lang_sub, align: TOP_LEFT, x: 16, y: 44, text_font: ui_18, text_color: "${c_muted}", text: "Step 1 of 2 — the clinician's language"}
        - button:
            align: TOP_RIGHT
            x: -12
            y: 8
            width: 120
            height: 44
            pad_all: 0
            widgets: [{label: {align: CENTER, text_font: ui_18, text: "Back"}}]
            on_click:
              - lambda: |-
                  if (id(lang_step) == 1) { lv_scr_load(id(page_to)->obj); }
                  else { lv_scr_load(id(page_start)->obj); }
        # more than 20 languages: page through them (‹ › sit in the title row)
        - button: {id: lp_prev, align: TOP_RIGHT, x: -244, y: 8, width: 52, height: 44, pad_all: 0, hidden: true,
                   widgets: [{label: {align: CENTER, text: "‹", text_font: ui_28, text_color: "${c_muted}"}}],
                   on_click: {lambda: "id(lang_page)--; id(show_langs).execute();"}}
        - button: {id: lp_next, align: TOP_RIGHT, x: -144, y: 8, width: 52, height: 44, pad_all: 0, hidden: true,
