# Waveshare ESP32-S3-Touch-LCD-7 (Rev 1.2, N16R8) — phrase_recorder touch panel
# Board/display block adapted from github.com/inytar/waveshare-esp32-s3-touch-lcd-7-esphome
substitutions:
  name: phrase-panel
  panel_token: !secret panel_token         # this panel's device token (nano/panel_admin.py devices; nano.sh panel registers it)
  # the same three networks as wifi: below, for the Wi-Fi page (wifi.configure needs the key at runtime)
  w_ssid1: !secret wifi_ssid
  w_pw1: !secret wifi_password
  w_ssid2: !secret kit_ssid
  w_pw2: !secret kit_password
  w_ssid3: !secret demo_ssid
  w_pw3: !secret demo_password
  nano_url: "http://192.168.68.111:8765"   # nano/panel_api.py when on the home LAN (on PhraseKit it is 10.42.0.1)
  wifi_ssid_hint: "gadgetboy2"
  # Palette from docs/project-brief.md §10: clinician = sage, patient = steel blue, brick reserved.
  c_base: "0xF6F4EF"
  c_panel: "0xFFFFFF"
  c_ink: "0x1B2621"
  c_sage: "0x4A7A68"
  c_sage_soft: "0xE3EDE8"
  c_steel: "0x6B7F9E"
  c_steel_soft: "0xE6EAF1"
  c_amber: "0xB8843C"
  c_line: "0xDCD7C9"
  c_muted: "0x8A8474"

esphome:
  name: ${name}
  min_version: "2025.8.0"
  includes: [panel_helpers.h]
  platformio_options:
    board_upload.maximum_ram_size: 524288

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "32768"   # touch → HTTP → JSON → page build all run on this stack
      # Internal RAM was down to a 7 KB largest block (Wi-Fi + LVGL + fonts + strings all internal);
      # let malloc() use the 8 MB PSRAM for anything over 4 KB, keep a reserve for DMA/Wi-Fi.
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "49152"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  logs:
    lvgl: INFO
    wifi: INFO
    api: INFO
    scheduler: INFO
    component: INFO
    touch: INFO
  hardware_uart: UART0            # the board's UART1 USB-C socket (CH343) — crash backtraces land here
  baud_rate: 115200


api:
  reboot_timeout: 0s        # no Home Assistant; never reboot for lack of a client
ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret kit_ssid          # the Nano's own hotspot (demo kit) — preferred
      password: !secret kit_password
      priority: 10
    - ssid: !secret wifi_ssid         # home LAN
      password: !secret wifi_password
    - ssid: !secret demo_ssid         # phone hotspot the Nano also knows ("iPhone (2)")
      password: !secret demo_password
  on_connect:
    - lambda: |-
        id(nano_base) = std::string([]{ std::array<char, wifi::SSID_BUFFER_SIZE> b; return std::string(wifi::global_wifi_component->wifi_ssid_to(b)); }()) == "PhraseKit" ? "http://10.42.0.1:8765" : "${nano_url}";
        id(nano_ok) = false;
        id(check_nano).execute();
  ap:
    ssid: "phrase-panel setup"
captive_portal:

web_server:
  port: 80

json:

# The Nano announces itself by UDP beacon every 3 s ({"nano": "http://<ip>:8765"}); following it
# means the pair works on any Wi-Fi they both join — home LAN, a phone hotspot, PhraseKit.
udp:
  port: 18511
  on_receive:
    - lambda: |-
        std::string body(data.begin(), data.end());
        json::parse_json(body, [](JsonObject root) -> bool {
          if (root["nano"].is<const char *>()) {
            std::string u = root["nano"].as<std::string>();
            if (u != id(nano_base)) { ESP_LOGI("beacon", "Nano is at %s", u.c_str()); id(nano_base) = u; id(nano_ok) = false; }
            id(beacon_at) = millis();
            // the Nano was told (by an iPad) to move: follow it, exactly as if this panel had asked
            if (root["moving_to"].is<const char *>()) {
              std::string to = root["moving_to"].as<std::string>();
              if (!to.empty() && to != id(wifi_follow) && (to == "${w_ssid1}" || to == "${w_ssid2}" || to == "${w_ssid3}")) {
                id(wifi_follow) = to; id(wifi_target) = to; id(need_follow) = true;
                ESP_LOGI("beacon", "Nano is moving to %s — following", to.c_str());
              }
            }
            JsonObject h = root["health"];
            if (!h.isNull()) { id(h_speech) = (h["whisper"] | false) && (h["piper"] | false); id(h_translator) = h["translator"].is<const char *>(); id(h_db) = h["db"] | false; }
          }
          return true;
        });

# Text the panel cannot draw itself (Devanagari, Gurmukhi, Lao, CJK) arrives as PNGs from the Nano's
# /render endpoints; the patient page swaps its labels for these images (see show_patient).
online_image:
  - id: img_phrase
    url: http://127.0.0.1/none
    format: PNG
    type: RGB565
    update_interval: never
    on_download_finished:
      - lvgl.image.update: {id: pt_dst_img, src: img_phrase}
      - lvgl.widget.show: pt_dst_img
    on_error:
      - lambda: 'ESP_LOGW("img", "phrase image failed");'
  - id: img_replies
    url: http://127.0.0.1/none
    format: PNG
    type: RGB565
    update_interval: never
    on_download_finished:
      - lvgl.image.update: {id: replies_img, src: img_replies}
      - lvgl.widget.show: replies_img
    on_error:
      - lambda: 'ESP_LOGW("img", "replies image failed");'
  - id: img_mic
    url: http://127.0.0.1/none
    format: PNG
    type: RGB565
    update_interval: never
    on_download_finished:
      - lvgl.image.update: {id: mic_img, src: img_mic}
      - lvgl.widget.show: mic_img
    on_error:
      - lambda: 'ESP_LOGW("img", "mic image failed");'
  - id: img_heard
    url: http://127.0.0.1/none
    format: PNG
    type: RGB565
    update_interval: never
    on_download_finished:
      - lvgl.image.update: {id: rp_heard_img, src: img_heard}
      - lvgl.widget.show: rp_heard_img
    on_error:
      - lambda: 'ESP_LOGW("img", "heard image failed");'

http_request:
  verify_ssl: false
  buffer_size_tx: 4096     # the reply-strip image URL carries eight encoded phrases (~1.5 KB)
  # Requests run in the main loop. With the Nano on ANOTHER network, packets vanish and every call waits
  # the full timeout — at 30 s that starved the task watchdog and the panel crash-looped into safe mode
  # (2026-09-20). 12 s still covers stop → Whisper → NLLB; the watchdog is told a request is in flight.
  timeout: 12s
  watchdog_timeout: 30s

i2c:
  sda: GPIO08
  scl: GPIO09
  scan: true
  id: bus_a

ch422g:
  - id: ch422g_hub

output:
  - platform: gpio
    id: lcdbacklight_output
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true

light:
  - platform: binary
    output: lcdbacklight_output
    id: lcdbacklight
    name: LCD Backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red:   [1, 2, 42, 41, 40]
      green: [39, 0, 45, 48, 47, 21]
      blue:  [14, 38, 18, 17, 10]

touchscreen:
  platform: gt911
  id: waveshare_touch
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  on_touch:
    - lambda: ESP_LOGI("touch", "x=%d y=%d", touch.x, touch.y);



# Inter from Google Fonts: LVGL's built-in font has no macrons, and the Nano sends Te Reo text.
font:
  - file: gfonts://Inter
    id: ui_28
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Latin_Vietnamese]
    glyphs: &glyphs "…→°●■↓‹›✓✗·—↻ĀāĒēĪīŌōŪūʻʼ"
  - file: gfonts://Inter
    id: ui_22
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Latin_Vietnamese]
    glyphs: *glyphs
  - file: gfonts://Inter
    id: ui_18
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Latin_Vietnamese]
    glyphs: *glyphs
  - file: gfonts://Inter
    id: ui_14
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Latin_Vietnamese]
    glyphs: *glyphs
  - file: gfonts://Noto Sans Arabic
    id: ar_28
    size: 28
    bpp: 4
    glyphs: &arabic " !#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_`abcdefghijklmnopqrstuvwxyz{|}~·ĀāĒēĪīŌōŪū،؛؟ءآأؤإئابةتثجحخدذرزسشصضطظعغػؼؽؾؿـفقكلمنهوىي٠١٢٣٤٥٦٧٨٩پچژکگی۰۱۲۳۴۵۶۷۸۹—…ﭖﭗﭘﭙﭺﭻﭼﭽﮊﮋﮎﮏﮐﮑﮒﮓﮔﮕﯼﯽﯾﯿﹰﹱﹲﹳﹴﹶﹷﹸﹹﹺﹻﹼﹽﹾﹿﺀﺁﺂﺃﺄﺅﺆﺇﺈﺉﺊﺋﺌﺍﺎﺏﺐﺑﺒﺓﺔﺕﺖﺗﺘﺙﺚﺛﺜﺝﺞﺟﺠﺡﺢﺣﺤﺥﺦﺧﺨﺩﺪﺫﺬﺭﺮﺯﺰﺱﺲﺳﺴﺵﺶﺷﺸﺹﺺﺻﺼﺽﺾﺿﻀﻁﻂﻃﻄﻅﻆﻇﻈﻉﻊﻋﻌﻍﻎﻏﻐﻑﻒﻓﻔﻕﻖﻗﻘﻙﻚﻛﻜﻝﻞﻟﻠﻡﻢﻣﻤﻥﻦﻧﻨﻩﻪﻫﻬﻭﻮﻯﻰﻱﻲﻳﻴﻵﻶﻷﻸﻹﻺﻻﻼ"
  - file: gfonts://Noto Sans Arabic
    id: ar_22
    size: 22
    bpp: 4
    glyphs: *arabic
  - file: gfonts://Noto Sans Arabic
    id: ar_18
    size: 18
