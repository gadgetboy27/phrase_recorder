              - button: {id: b6, grid_cell_column_pos: 2, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k6, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l6, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(5);"}}
        # ---- conversation row: clinician (sage, left) | heard (steel, right) | mic ----
        - obj:
            id: said_box
            align: BOTTOM_LEFT
            x: 12
            y: -12
            width: 356
            height: 104
            bg_color: "${c_panel}"
            border_color: "${c_sage}"
            border_width: 2
            radius: 12
            pad_all: 8
            widgets:
              - label: {id: said_who, align: TOP_LEFT, text: "Clinician", text_font: ui_18, text_color: "${c_sage}"}
              - button:
                  id: offer_btn
                  align: TOP_RIGHT
                  width: 110
                  height: 36
                  pad_all: 0
                  hidden: true
                  bg_color: "${c_amber}"
                  border_width: 0
                  widgets: [{label: {align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "Record it"}}]
                  on_click:
                    - lambda: |-
                        lv_obj_add_flag(id(offer_btn), LV_OBJ_FLAG_HIDDEN);
                        id(want_rec) = id(last_phrase);
                        if (id(consented) && !id(spk_id).empty()) { id(set_mode).execute(true); }
                        else { lv_obj_clear_flag(id(vol_sheet), LV_OBJ_FLAG_HIDDEN); }
              - label: {id: said_lbl, align: BOTTOM_LEFT, width: 100%, long_mode: WRAP, text_font: ui_18, text_color: "${c_ink}", text: "Tap a phrase to say it."}
              - label: {id: said_lbl_ar, align: BOTTOM_LEFT, width: 100%, long_mode: WRAP, text_font: ar_18, text_color: "${c_ink}", text: "", hidden: true}
        - obj:
            id: heard_box
            align: BOTTOM_LEFT
            x: 380
            y: -12
            width: 296
            height: 104
            bg_color: "${c_panel}"
            border_color: "${c_steel}"
            border_width: 2
            radius: 12
            pad_all: 8
            widgets:
              - label: {id: heard_who, align: TOP_RIGHT, text: "Heard", text_font: ui_18, text_color: "${c_steel}"}
              - label: {id: heard_lbl, align: BOTTOM_LEFT, width: 100%, long_mode: WRAP, text_font: ui_18, text_color: "${c_ink}", text: "—"}
              - label: {id: heard_lbl_ar, align: BOTTOM_LEFT, width: 100%, long_mode: WRAP, text_font: ar_18, text_color: "${c_ink}", text: "", hidden: true}
        - button:
            id: mic_btn
            align: BOTTOM_RIGHT
            x: -12
            y: -12
            width: 96
            height: 104
            bg_color: "${c_steel}"
            border_width: 0
