    # ================= 4. conversation =================
    - id: main_page
      bg_color: "${c_base}"
      pad_all: 0
      widgets:
        # ---- header: language pair (tap to change) | mode | category ----
        - obj: {id: src_chip, align: TOP_LEFT, x: 12, y: 10, width: 124, height: 44, bg_color: "${c_sage}", border_width: 0, radius: 12, pad_all: 0, clickable: true,
                outline_width: 0, outline_color: "${c_sage}", outline_pad: 3,
                widgets: [{label: {id: src_lbl, align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "English"}}],
                on_click: {lambda: "id(set_turn).execute(0);"}}
        - label: {align: TOP_LEFT, x: 144, y: 20, text_font: ui_22, text_color: "${c_muted}", text: "→"}
        - obj: {id: dst_chip, align: TOP_LEFT, x: 170, y: 10, width: 124, height: 44, bg_color: "${c_steel}", border_width: 0, radius: 12, pad_all: 0, clickable: true,
                outline_width: 0, outline_color: "${c_steel}", outline_pad: 3,
                widgets: [{label: {id: dst_lbl, align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "…"}}],
                on_click: {lambda: "id(set_turn).execute(1);"}}
        - button: {align: TOP_LEFT, x: 302, y: 10, width: 70, height: 44, pad_all: 0, border_color: "${c_line}",
                   widgets: [{label: {align: CENTER, text_font: ui_14, text_color: "${c_muted}", text: "change"}}],
                   on_click: {lambda: "lv_scr_load(id(page_start)->obj);"}}
        - button:
            id: mode_btn
            align: TOP_RIGHT
            x: -212
            y: 10
            width: 190
            height: 44
            pad_all: 0
            widgets:
              - label: {id: mode_lbl, align: CENTER, text_font: ui_18, text: "+ Add phrase"}
            on_click:
              - lambda: |-
                  if (id(rec_mode)) { id(set_mode).execute(false); }                  // "done" ends Record mode
                  else if (id(consented) && !id(spk_id).empty()) { id(add_open).execute(); }
                  else { lv_obj_clear_flag(id(vol_sheet), LV_OBJ_FLAG_HIDDEN); }     // who is recording, and consent
        - dropdown:
            id: cat_dd
            align: TOP_RIGHT
            x: -12
            y: 10
            width: 200
            height: 44
            symbol: "↓"
            options: ["All categories"]
            dropdown_list: {text_font: ui_18, bg_color: "${c_panel}", text_color: "${c_ink}", max_height: 380}
            on_value:
              - lambda: |-
                  id(cat_filter) = x == 0 ? std::string("") : id(cat_slugs)[x - 1];
                  id(page) = 0;
                  id(render).execute();
        # ---- phrase grid: 3 x 2 per page, arrows either side ----
        - button: {id: prev_btn, align: LEFT_MID, x: 8, y: -40, width: 36, height: 120, border_width: 0, bg_color: "${c_base}", pad_all: 0, hidden: true,
                   widgets: [{label: {align: CENTER, text: "‹", text_font: ui_28, text_color: "${c_muted}"}}],
                   on_click: {lambda: "id(page)--; id(render).execute();"}}
        - button: {id: next_btn, align: RIGHT_MID, x: -8, y: -40, width: 36, height: 120, border_width: 0, bg_color: "${c_base}", pad_all: 0, hidden: true,
                   widgets: [{label: {align: CENTER, text: "›", text_font: ui_28, text_color: "${c_muted}"}}],
                   on_click: {lambda: "id(page)++; id(render).execute();"}}
        - obj:
            id: grid
            align: TOP_MID
            y: 64
            width: 700
            height: 280
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout: {type: grid, grid_columns: [FR(1), FR(1), FR(1)], grid_rows: [FR(1), FR(1)], pad_column: 10, pad_row: 10}
            widgets:
              - button: {id: b1, grid_cell_column_pos: 0, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k1, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l1, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(0);"}}
