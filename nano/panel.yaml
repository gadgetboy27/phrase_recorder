              - label: {id: mic_lbl, align: CENTER, text_align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "●\nRecord"}
            on_click:
              - lambda: |-
                  id(send_phrase).execute(id(recording) ? "stop" : "record");
