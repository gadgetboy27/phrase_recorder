interval:
  - interval: 5s
    then:
      - script.execute: check_nano
  - interval: 300ms                      # queued reloads run here, from a clean stack
    then:
      - lambda: |-
          if (id(need_load) && !id(polling) && id(nano_ok)) { id(need_load) = false; ESP_LOGD("diag", "timer → load_phrases (running=%d)", (int) id(load_phrases).is_running()); id(load_phrases).execute(); return; }
          if (id(need_images) && !id(polling) && id(nano_ok)) { id(need_images) = false; id(fetch_images).execute(); return; }
          if (id(need_mic) && !id(polling) && id(nano_ok)) { id(need_mic) = false; id(fetch_mic).execute(); return; }
          if (id(need_heard) && !id(polling) && id(nano_ok)) { id(need_heard) = false; id(fetch_heard).execute(); return; }
          if (id(need_langs) && !id(polling) && id(nano_ok)) { id(need_langs) = false; id(add_langs).execute(); return; }
          if (id(need_follow)) { id(need_follow) = false; id(wifi_follow_go).execute(); return; }
  - interval: 600ms
    then:
      - lambda: |-
          if (id(recording) && id(turn) == 1) id(mic_label).execute();
          static bool on = false; on = !on;
          lv_obj_t *chip = id(turn) == 0 ? id(src_chip) : id(dst_chip);
          lv_obj_set_style_outline_width(chip, on ? 4 : 0, LV_PART_MAIN);

script:
  - id: check_nano
    then:
      - lambda: |-
          // Liveness from the beacon's age — never an HTTP call here: a call to a Nano that is on another
          // network blocks the loop for the whole timeout (the "freezes on the hotspot").
          static std::string st;
          if (!wifi::global_wifi_component->is_connected()) {
            st = "Wi-Fi: looking for PhraseKit / " + std::string("${wifi_ssid_hint}") + "…";
            lv_label_set_text(id(status_lbl), st.c_str());
            id(nano_ok) = false;
            return;
          }
          const std::string ssid = []{ std::array<char, wifi::SSID_BUFFER_SIZE> b; return std::string(wifi::global_wifi_component->wifi_ssid_to(b)); }();
          const bool alive = id(beacon_at) != 0 && (millis() - id(beacon_at)) < 10000;   // beacons come every 3 s
          if (!alive) {
            id(nano_ok) = false;
            st = "Wi-Fi: " + ssid + " ✓  ·  Nano: not on this network (no beacon)";
            lv_label_set_text(id(status_lbl), st.c_str());
            return;
          }
          std::string host = id(nano_base);                    // "http://172.20.10.12:8765" → "172.20.10.12": where the Nano is, for the iPad
          if (host.rfind("http://", 0) == 0) host = host.substr(7);
          if (host.size() > 5 && host.compare(host.size() - 5, 5, ":8765") == 0) host = host.substr(0, host.size() - 5);
          st = "Wi-Fi: " + ssid + " ✓  ·  Nano ✓ " + host + "  ·  speech " + (id(h_speech) ? "✓" : "✗")
             + "  ·  translator " + (id(h_translator) ? "✓" : "starting…") + "  ·  db " + (id(h_db) ? "✓" : "✗");
          lv_label_set_text(id(status_lbl), st.c_str());
          const bool first = !id(nano_ok);
          id(nano_ok) = true;
          if (first || id(ph_keys).empty()) id(need_load) = true;

  # Fetch the phrase list for the current language and rebuild the dropdowns + grid.
  - id: load_phrases
    then:
      - lambda: 'ESP_LOGD("diag", "load_phrases: GET %s/phrases?lang=%s&src=%s", id(nano_base).c_str(), id(lang_code).c_str(), id(src_code).c_str());'
      - http_request.get:
          request_headers: {Authorization: "Bearer ${panel_token}"}
          url: !lambda return std::string(id(nano_base) + "/phrases?lang=") + id(lang_code) + "&src=" + id(src_code);
          capture_response: true
          max_response_buffer_size: 16384
          on_response:
            - lambda: |-
                ESP_LOGD("diag", "phrases response: %d bytes, heap free %u / largest %u, psram free %u",
                         (int) body.size(), (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                         (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL), (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
                bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                  std::string copts = "All categories";
                  id(lang_codes).clear(); id(lang_names).clear();
                  lang_scripts().clear();
                  for (JsonObject l : root["languages"].as<JsonArray>()) {
                    id(lang_codes).push_back(l["code"].as<std::string>());
                    id(lang_names).push_back(l["label"].as<std::string>());
                    std::string sc = l["script"].is<const char *>() ? l["script"].as<std::string>() : "latin";
                    lang_scripts()[l["code"].as<std::string>()] = sc == "arabic" ? 1 : sc == "image" ? -1 : 0;
                  }
                  id(cat_slugs).clear();
                  for (JsonObject c : root["categories"].as<JsonArray>()) {
                    id(cat_slugs).push_back(c["slug"].as<std::string>());
                    copts += "\n"; copts += c["label"].as<std::string>();
                  }
                  id(ph_keys).clear(); id(ph_texts).clear(); id(ph_cats).clear(); id(ph_rec).clear(); id(ph_trans).clear(); id(ph_src).clear();
                  id(ph_draft).clear(); id(replies).clear(); id(ui_reply) = -1;
                  for (JsonObject p : root["phrases"].as<JsonArray>()) {
                    id(ph_draft).push_back(p["draft"].is<const char *>() ? p["draft"].as<std::string>() : std::string());
                    std::string cat = p["category"].as<std::string>();
                    if (cat == "patient_replies") id(replies).push_back(id(ph_keys).size());
                    std::string k = p["key"].as<std::string>();
                    if (k == "p020") id(ui_reply) = id(ph_keys).size();
                    if (k == "p021") id(ui_stop) = id(ph_keys).size();
                    if (k == "p022") id(ui_again) = id(ph_keys).size();
                    if (k == "p023") id(ui_hear) = id(ph_keys).size();
                    id(ph_trans).push_back(p["translation"].is<const char *>() ? p["translation"].as<std::string>() : std::string());
                    id(ph_src).push_back(p["src_text"].is<const char *>() ? p["src_text"].as<std::string>() : std::string());
                    id(ph_keys).push_back(p["key"].as<std::string>());
                    id(ph_texts).push_back(p["text"].as<std::string>());
                    id(ph_cats).push_back(p["category"].as<std::string>());
                    id(ph_rec).push_back(p["recording"].as<bool>());
                  }
                  int ci = lv_dropdown_get_selected(id(cat_dd)->obj);
                  lv_dropdown_set_options(id(cat_dd)->obj, copts.c_str());
                  lv_dropdown_set_selected(id(cat_dd)->obj, ci);
                  return true;
                });
                ESP_LOGD("diag", "parsed ok=%d: %d phrases, %d langs, %d replies; rendering", (int) ok, (int) id(ph_keys).size(), (int) id(lang_codes).size(), (int) id(replies).size());
                // a remembered pair from last time → offer to resume
                int n = id(lang_codes).size();
                if (id(src_idx) >= 0 && id(src_idx) < n && id(dst_idx) >= 0 && id(dst_idx) < n) {
                  static std::string r; r = "Resume  " + id(lang_names)[id(src_idx)] + "  →  " + id(lang_names)[id(dst_idx)];
                  lv_label_set_text(id(resume_lbl), r.c_str());
                  lv_obj_clear_flag(id(resume_btn), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(resume_btn), LV_OBJ_FLAG_HIDDEN);
                }
                id(render).execute();
                ESP_LOGD("diag", "render done");
          on_error:
            - lambda: 'ESP_LOGE("diag", "phrases request failed");'
            - lambda: 'set_text_any(id(said_lbl), id(said_lbl_ar), std::string("Nano not reachable — check it is on."));'

  # Lay the current page of the (filtered) phrase list onto the nine buttons.
  - id: render
    then:
      - lambda: |-
          lv_obj_t *btns[] = {id(b1), id(b2), id(b3), id(b4), id(b5), id(b6)};
          lv_obj_t *lbls[] = {id(l1), id(l2), id(l3), id(l4), id(l5), id(l6)};
          lv_obj_t *keys[] = {id(k1), id(k2), id(k3), id(k4), id(k5), id(k6)};
          const int PER = 6;
          std::vector<int> match;
          for (size_t i = 0; i < id(ph_keys).size(); i++) {
            if (id(ph_cats)[i] == "patient_replies" || id(ph_cats)[i] == "panel_ui") continue;   // patient page only
            if (id(cat_filter).empty() || id(ph_cats)[i] == id(cat_filter)) match.push_back(i);
          }
          int pages = std::max(1, ((int) match.size() + PER - 1) / PER);
          if (id(page) >= pages) id(page) = pages - 1;
          if (id(page) < 0) id(page) = 0;
          id(shown).clear();
          for (int n = 0; n < PER; n++) {
            int m = id(page) * PER + n;
            if (m < (int) match.size()) {
              int i = match[m];
              id(shown).push_back(i);
              std::string t = id(ph_src)[i].empty() ? id(ph_texts)[i] : id(ph_src)[i];
              if (t.size() > 64) t = t.substr(0, 63) + "…";
              // a human recording exists in this language: say so in the small key label, not as a blob in the text
              lv_label_set_text(lbls[n], t.c_str());
              { static std::string k[6]; k[n] = id(ph_keys)[i] + (id(ph_rec)[i] ? "  · recorded" : ""); lv_label_set_text(keys[n], k[n].c_str()); }
              const bool used = (i == id(last_used));
              lv_obj_set_style_bg_color(btns[n], lv_color_hex(used ? lang_colour(id(lang_code)) : ${c_panel}), LV_PART_MAIN);
              lv_obj_set_style_border_color(btns[n], lv_color_hex(used ? lang_colour(id(lang_code)) : ${c_sage}), LV_PART_MAIN);
              lv_obj_set_style_text_color(lbls[n], lv_color_hex(used ? ${c_panel} : ${c_ink}), LV_PART_MAIN);
              lv_obj_set_style_text_color(keys[n], lv_color_hex(used ? ${c_panel} : ${c_muted}), LV_PART_MAIN);
              lv_obj_clear_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            }
          }
          if (id(page) > 0) lv_obj_clear_flag(id(prev_btn), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(prev_btn), LV_OBJ_FLAG_HIDDEN);
          if (id(page) < pages - 1) lv_obj_clear_flag(id(next_btn), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(next_btn), LV_OBJ_FLAG_HIDDEN);

  # Wizard: lay the languages on the 20 buttons, coloured for the step (sage = I speak, steel = translate to).
  - id: show_langs
    then:
      - lambda: |-
          lv_obj_t *btns[] = {id(g1), id(g2), id(g3), id(g4), id(g5), id(g6), id(g7), id(g8), id(g9), id(g10), id(g11), id(g12), id(g13), id(g14), id(g15), id(g16), id(g17), id(g18), id(g19), id(g20)};
          lv_obj_t *lbls[] = {id(gl1), id(gl2), id(gl3), id(gl4), id(gl5), id(gl6), id(gl7), id(gl8), id(gl9), id(gl10), id(gl11), id(gl12), id(gl13), id(gl14), id(gl15), id(gl16), id(gl17), id(gl18), id(gl19), id(gl20)};
          const bool to = id(lang_step) == 1;
          lv_label_set_text(id(lang_title), to ? "Translate to" : "I speak");
          lv_obj_set_style_text_color(id(lang_title), lv_color_hex(to ? ${c_steel} : ${c_sage}), LV_PART_MAIN);
          static std::string sub;
          sub = to ? "Step 2 of 2 — the patient's language  (you speak " + id(lang_names)[id(src_idx)] + ")"
                   : "Step 1 of 2 — the clinician's language";
          lv_label_set_text(id(lang_sub), sub.c_str());
          const int pages = std::max(1, ((int) id(lang_names).size() + 19) / 20);
          if (id(lang_page) >= pages) id(lang_page) = pages - 1;
          if (id(lang_page) < 0) id(lang_page) = 0;
          for (int n = 0; n < 20; n++) {
            const int i = id(lang_page) * 20 + n;
            if (i < (int) id(lang_names).size() && !(to && i == id(src_idx))) {   // never the same language twice
              lv_label_set_text(lbls[n], id(lang_names)[i].c_str());
              lv_obj_set_style_border_color(btns[n], lv_color_hex(lang_colour(id(lang_codes)[i])), LV_PART_MAIN);
              lv_obj_set_style_border_width(btns[n], 4, LV_PART_MAIN);
              lv_obj_clear_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            }
          }
          if (id(lang_page) > 0) lv_obj_clear_flag(id(lp_prev), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(lp_prev), LV_OBJ_FLAG_HIDDEN);
          if (id(lang_page) < pages - 1) lv_obj_clear_flag(id(lp_next), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(lp_next), LV_OBJ_FLAG_HIDDEN);
          lv_scr_load(id(page_lang)->obj);

  - id: pick_lang
    parameters:
      n: int
    then:
      - lambda: |-
          n += id(lang_page) * 20;
          if (n >= (int) id(lang_codes).size()) return;
          if (millis() - id(last_tap) < 500) return;          // one tap = one step
          id(last_tap) = millis();
          if (id(lang_step) == 0) {
            id(src_idx) = n;
            static std::string t; t = "I speak " + id(lang_names)[n];
            lv_label_set_text(id(to_src_lbl), t.c_str());
            lv_scr_load(id(page_to)->obj);
            return;
          }
          if (n == id(src_idx)) return;
          id(dst_idx) = n;
          id(apply_pair).execute();

  # Make the chosen pair live: chips in the header, texts reloaded, conversation screen shown.
  - id: apply_pair
    then:
      - lambda: |-
          id(src_code) = id(lang_codes)[id(src_idx)];
          id(lang_code) = id(lang_codes)[id(dst_idx)];
          lv_label_set_text(id(src_lbl), id(lang_names)[id(src_idx)].c_str());
          lv_label_set_text(id(dst_lbl), id(lang_names)[id(dst_idx)].c_str());
          lv_obj_set_style_bg_color(id(src_chip), lv_color_hex(lang_colour(id(src_code))), LV_PART_MAIN);
          lv_obj_set_style_outline_color(id(src_chip), lv_color_hex(lang_colour(id(src_code))), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(dst_chip), lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_outline_color(id(dst_chip), lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(said_box), lv_color_hex(lang_colour(id(src_code))), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(said_who), lv_color_hex(lang_colour(id(src_code))), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(heard_box), lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(heard_who), lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(reply_bar), lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(reply_mic), lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(pt_repeat), lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(back_btn), lv_color_hex(lang_colour(id(src_code))), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(rp_bar_pt), lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(rp_again), lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(rp_bar_cl), lv_color_hex(lang_colour(id(src_code))), LV_PART_MAIN);
          id(last_used) = -1;
          set_text_any(id(said_lbl), id(said_lbl_ar), std::string("Tap a phrase to say it."));
          set_text_any(id(heard_lbl), id(heard_lbl_ar), std::string("—"));
          id(page) = 0;
          id(set_turn).execute(0);
          lv_scr_load(id(main_page)->obj);
          id(need_load) = true;
      - http_request.post:
          request_headers: {Authorization: "Bearer ${panel_token}"}
          url: !lambda return id(nano_base) + "/panel/session?src=" + id(src_code) + "&dst=" + id(lang_code);

  # Whose turn: the active chip pulses (see interval:), the mic takes that side's colour.
  - id: set_turn
    parameters:
      t: int
    then:
      - lambda: |-
          id(turn) = t;
          lv_obj_set_style_bg_color(id(mic_btn), lv_color_hex(lang_colour(t == 0 ? id(src_code) : id(lang_code))), LV_PART_MAIN);
          lv_obj_set_style_outline_width(t == 0 ? id(dst_chip) : id(src_chip), 0, LV_PART_MAIN);
          static std::string m;
          m = t == 0 ? "Clinician speaking — tap a phrase, or hold the mic to say something else"
                     : "Patient speaking — tap the mic, then Stop";
          set_text_any(id(said_lbl), id(said_lbl_ar), std::string(m.c_str()));

  # Turn the device to the patient: what was just said, in their language, plus ways to answer.
  - id: show_patient
    parameters:
      i: int
    then:
      - lambda: |-
          id(cur_phrase) = i;
          const int script = lang_script(id(lang_code));
          std::string dst = id(ph_trans)[i], note;
          if (dst.empty() && !id(ph_draft)[i].empty()) { dst = id(ph_draft)[i]; note = "unverified — machine translation, not yet checked by a speaker"; }
          if (dst.empty()) { dst = id(ph_texts)[i]; note = "no " + id(lang_names)[id(dst_idx)] + " version yet — shown in English"; }
          const bool imgmode = script < 0 && !dst.empty() && dst != id(ph_texts)[i];   // rendered by the Nano
          lv_obj_add_flag(id(pt_dst_img), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(replies_img), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(mic_img), LV_OBJ_FLAG_HIDDEN);
          if (script < 0 && !imgmode) { dst = id(ph_texts)[i]; note = id(lang_names)[id(dst_idx)] + " — shown in English"; }
          lv_obj_t *big = script == 1 ? id(pt_dst_ar) : id(pt_dst);
          lv_obj_add_flag(script == 1 ? id(pt_dst) : id(pt_dst_ar), LV_OBJ_FLAG_HIDDEN);
          if (imgmode) {
            lv_obj_add_flag(big, LV_OBJ_FLAG_HIDDEN);
            const bool amber = note.rfind("unverified", 0) == 0;
            id(phrase_url) = id(nano_base) + "/render?lang=" + id(lang_code) + "&size=28&w=640&fg=" + (amber ? "B8843C" : "1B2621") + "&text=" + url_encode(dst);
          } else {
            lv_obj_clear_flag(big, LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(big, dst.c_str());
            lv_obj_set_style_text_color(big, lv_color_hex(note.rfind("unverified", 0) == 0 ? ${c_amber} : ${c_ink}), LV_PART_MAIN);
          }
          lv_label_set_text(id(pt_note), note.c_str());
          lv_label_set_text(id(pt_src), (id(ph_src)[i].empty() ? id(ph_texts)[i] : id(ph_src)[i]).c_str());
          // "Tap to reply" in their language, if we have it
          lv_label_set_text(id(reply_bar_lbl), id(lang_names)[id(dst_idx)].c_str());
          // preset replies — in the patient's language (approved, else amber draft), English beneath
          id(replies_url) = id(nano_base) + "/render/replies?lang=" + id(lang_code);
          lv_obj_t *btns[] = {id(r1), id(r2), id(r3), id(r4), id(r5), id(r6), id(r7), id(r8)};
          lv_obj_t *dl[] = {id(rd1), id(rd2), id(rd3), id(rd4), id(rd5), id(rd6), id(rd7), id(rd8)};
          lv_obj_t *da[] = {id(rd1_ar), id(rd2_ar), id(rd3_ar), id(rd4_ar), id(rd5_ar), id(rd6_ar), id(rd7_ar), id(rd8_ar)};
          lv_obj_t *sl[] = {id(rs1), id(rs2), id(rs3), id(rs4), id(rs5), id(rs6), id(rs7), id(rs8)};
          for (int n = 0; n < 8; n++) {
            if (n < (int) id(replies).size()) {
              int r = id(replies)[n];
              std::string t = id(ph_trans)[r];
              bool draft = false;
              if (t.empty() && !id(ph_draft)[r].empty()) { t = id(ph_draft)[r]; draft = true; }
              std::string sub = id(ph_src)[r].empty() ? id(ph_texts)[r] : id(ph_src)[r];
              if (imgmode && !t.empty()) {                       // goes into the rendered strip instead
                char k[8]; snprintf(k, sizeof k, "%d", n);
                id(replies_url) += std::string("&t") + k + "=" + url_encode(t) + "&s" + k + "=" + url_encode(sub) + (draft ? std::string("&a") + k + "=1" : "");
                lv_obj_add_flag(dl[n], LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(da[n], LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(sl[n], LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_style_bg_opa(btns[n], LV_OPA_TRANSP, LV_PART_MAIN);
              } else {
                if (t.empty() || script < 0) t = id(ph_texts)[r];
                set_text_any(dl[n], da[n], t);
                lv_obj_clear_flag(sl[n], LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_style_bg_opa(btns[n], LV_OPA_COVER, LV_PART_MAIN);
                lv_obj_set_style_text_color(has_arabic(t) ? da[n] : dl[n], lv_color_hex(draft ? ${c_amber} : ${c_ink}), LV_PART_MAIN);
                lv_label_set_text(sl[n], sub.c_str());
              }
              lv_obj_set_style_border_color(btns[n], lv_color_hex(lang_colour(id(lang_code))), LV_PART_MAIN);
              lv_obj_clear_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            }
          }
          id(mic_label).execute();
          if (imgmode) id(need_images) = true; else id(phrase_url) = "";
          set_text_any(id(pt_result), id(pt_result_ar), std::string("—"));
          lv_scr_load(id(page_patient)->obj);

  # "Hear it again": the Nano says the phrase on the patient page once more. Nothing else changes.
  - id: repeat_phrase
    then:
      - if:
          condition:
            lambda: 'return id(cur_phrase) >= 0 && id(cur_phrase) < (int) id(ph_keys).size();'
          then:
            - http_request.post:
                request_headers: {Authorization: "Bearer ${panel_token}"}
                url: !lambda return id(nano_base) + "/panel/" + id(ph_keys)[id(cur_phrase)] + "?lang=" + id(lang_code) + "&src=" + id(src_code) + "&repeat=1";
                capture_response: false
                on_error:
                  - lambda: 'ESP_LOGW("repeat", "Nano not reachable");'

  # ---- "Add phrase" page ---------------------------------------------------------------------
  # Open it: categories from the last /phrases, then ask the Nano which languages could be added.
  - id: add_open
    then:
      - lambda: |-
          static std::string t; t = "Add to the phrasebook  ·  " + id(spk_id) + " (" + id(spk_type) + ")";
          lv_label_set_text(id(add_title), t.c_str());
          std::string copts; int sel = 0;
          for (size_t i = 0; i < id(cat_slugs).size(); i++) {
            if (!copts.empty()) copts += "\n";
            copts += id(cat_slugs)[i];
            if (id(cat_slugs)[i] == "intake") sel = i;
          }
          if (copts.empty()) copts = "intake";
          lv_dropdown_set_options(id(add_cat)->obj, copts.c_str());
          lv_dropdown_set_selected(id(add_cat)->obj, sel);
          lv_textarea_set_text(id(add_ta), "");
          lv_label_set_text(id(add_status), "");
          id(add_file) = ""; id(add_recording) = false;
          lv_label_set_text(id(add_mic_lbl), "●  Say it");
          static std::string r; r = "Record translations in " + (id(dst_idx) >= 0 && id(dst_idx) < (int) id(lang_names).size() ? id(lang_names)[id(dst_idx)] : std::string("the patient's language")) + " →";
          lv_label_set_text(id(add_rec_lbl), r.c_str());
          lv_scr_load(id(page_add)->obj);
      - script.execute: add_langs

  # The "Add a language" dropdown: what the Nano could take on (also re-run after an add, via need_langs).
  - id: add_langs
    then:
      - http_request.get:
          request_headers: {Authorization: "Bearer ${panel_token}"}
          url: !lambda return id(nano_base) + "/admin/languages";
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            - lambda: |-
                std::string opts; id(add_lang_codes).clear();
                json::parse_json(body, [&](JsonObject root) -> bool {
                  for (JsonObject l : root["languages"].as<JsonArray>()) {
                    if (!opts.empty()) opts += "\n";
                    opts += l["label"].as<std::string>();
                    if (!(l["font"] | true)) opts += " (font needed)";
                    id(add_lang_codes).push_back(l["code"].as<std::string>());
                  }
                  return true;
                });
                lv_dropdown_set_options(id(add_lang_dd)->obj, opts.empty() ? "— every known language is in —" : opts.c_str());
          on_error:
            - lambda: 'lv_dropdown_set_options(id(add_lang_dd)->obj, "Nano not reachable");'

  # ● starts a free English take on the Nano's mic; ■ stops it and puts Whisper's words in the box.
  - id: add_mic_tap
    then:
      - lambda: |-
          id(add_recording) = !id(add_recording);
          lv_label_set_text(id(add_mic_lbl), id(add_recording) ? "■  Stop" : "●  Say it");
          lv_label_set_text(id(add_status), id(add_recording) ? "Listening…" : "Transcribing…");
      - http_request.post:
          request_headers: {Authorization: "Bearer ${panel_token}"}
          url: !lambda |-
            return id(nano_base) + "/panel/" + std::string(id(add_recording) ? "record" : "stop") + "?lang=en&src=en&who=add";
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            - lambda: |-
                if (id(add_recording)) { lv_label_set_text(id(add_status), "Listening — tap ■ when you have said it."); return; }
                std::string text, file;
                json::parse_json(body, [&](JsonObject root) -> bool {
                  if (root["text"].is<const char *>()) text = root["text"].as<std::string>();
                  if (root["file"].is<const char *>()) file = root["file"].as<std::string>();
                  return true;
                });
                if (text.empty()) { lv_label_set_text(id(add_status), "Nothing heard — try again, a little closer to the mic."); return; }
                lv_textarea_set_text(id(add_ta), text.c_str());
                id(add_file) = file;
                lv_label_set_text(id(add_status), "Check the words (tap the box to edit), then Save phrase.");
          on_error:
            - lambda: 'id(add_recording) = false; lv_label_set_text(id(add_mic_lbl), "●  Say it"); lv_label_set_text(id(add_status), "Nano not reachable");'

  # Save: the words in the box become a phrase row on the Nano; the take (if any) is filed as its English recording.
  - id: add_save_tap
    then:
      - if:
          condition:
            lambda: 'return strlen(lv_textarea_get_text(id(add_ta))) >= 3 && !id(add_recording);'
          then:
            - lambda: 'lv_label_set_text(id(add_status), "Saving…");'
            - http_request.post:
                request_headers: {Authorization: "Bearer ${panel_token}"}
                url: !lambda |-
                  const int ci = lv_dropdown_get_selected(id(add_cat)->obj);
                  const std::string cat = ci < (int) id(cat_slugs).size() ? id(cat_slugs)[ci] : "intake";
                  return id(nano_base) + "/panel/phrase?text=" + url_encode(lv_textarea_get_text(id(add_ta))) + "&category=" + cat
                       + "&speaker=" + id(spk_id) + "&type=" + id(spk_type) + "&file=" + id(add_file) + "&device=panel";
                capture_response: true
                max_response_buffer_size: 1024
                on_response:
                  - lambda: |-
                      std::string say = body.substr(0, 200);
                      json::parse_json(body, [&](JsonObject root) -> bool {
                        if (root["say"].is<const char *>()) say = root["say"].as<std::string>();
                        return true;
                      });
                      lv_label_set_text(id(add_status), say.c_str());
                      if (response->status_code == 200) { lv_textarea_set_text(id(add_ta), ""); id(add_file) = ""; id(need_load) = true; }
                on_error:
                  - lambda: 'lv_label_set_text(id(add_status), "Nano not reachable");'
          else:
            - lambda: 'lv_label_set_text(id(add_status), id(add_recording) ? "Tap ■ first." : "Say the phrase (or type it) before saving.");'

  # Add the chosen language to the Nano's list; the wizard shows it after the reload.
  - id: add_lang_tap
    then:
      - if:
          condition:
            lambda: 'return lv_dropdown_get_selected(id(add_lang_dd)->obj) < (int) id(add_lang_codes).size();'
          then:
            - lambda: 'lv_label_set_text(id(add_status), "Adding the language (fetching its font if needed)…");'
            - http_request.post:
                request_headers: {Authorization: "Bearer ${panel_token}"}
                url: !lambda |-
                  return id(nano_base) + "/panel/language?code=" + id(add_lang_codes)[lv_dropdown_get_selected(id(add_lang_dd)->obj)];
                capture_response: true
                max_response_buffer_size: 1024
                on_response:
                  - lambda: |-
                      std::string say = body.substr(0, 200);
                      json::parse_json(body, [&](JsonObject root) -> bool {
                        if (root["say"].is<const char *>()) say = root["say"].as<std::string>();
                        return true;
                      });
                      lv_label_set_text(id(add_status), say.c_str());
                      if (response->status_code == 200) { id(need_load) = true; id(need_langs) = true; }
                on_error:
                  - lambda: 'lv_label_set_text(id(add_status), "Nano not reachable");'

  # ---- Wi-Fi page ----------------------------------------------------------------------------
  - id: wifi_open
    then:
      - lambda: 'lv_label_set_text(id(wifi_msg), "Asking the Nano which networks it knows…"); lv_scr_load(id(page_wifi)->obj);'
      - http_request.get:
          request_headers: {Authorization: "Bearer ${panel_token}"}
          url: !lambda return id(nano_base) + "/admin/wifi";
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            - lambda: |-
                lv_obj_t *btns[] = {id(wf1), id(wf2), id(wf3), id(wf4), id(wf5), id(wf6)};
                lv_obj_t *lbls[] = {id(wfl1), id(wfl2), id(wfl3), id(wfl4), id(wfl5), id(wfl6)};
                id(wifi_ssids).clear();
                std::vector<std::string> labels;
                json::parse_json(body, [&](JsonObject root) -> bool {
                  for (JsonObject n : root["networks"].as<JsonArray>()) {
                    std::string ssid = n["ssid"].as<std::string>();
                    id(wifi_ssids).push_back(ssid);
                    std::string l = ssid;
                    if (n["active"] | false) l += "\n● Nano is here";
                    else if (n["signal"].is<int>()) { char b[16]; snprintf(b, sizeof b, "\nin sight · %d%%", n["signal"].as<int>()); l += b; }
                    else l += "\nnot in sight";
                    const bool known = (ssid == "${w_ssid1}" || ssid == "${w_ssid2}" || ssid == "${w_ssid3}");
                    if (!known) l += " · panel has no key";
                    labels.push_back(l);
                  }
                  return true;
                });
                for (int i = 0; i < 6; i++) {
                  if (i < (int) labels.size()) { lv_label_set_text(lbls[i], labels[i].c_str()); lv_obj_clear_flag(btns[i], LV_OBJ_FLAG_HIDDEN); }
                  else lv_obj_add_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
                }
                lv_label_set_text(id(wifi_msg), "");
          on_error:
            - lambda: |-
                lv_obj_t *btns[] = {id(wf1), id(wf2), id(wf3), id(wf4), id(wf5), id(wf6)};
                lv_obj_t *lbls[] = {id(wfl1), id(wfl2), id(wfl3)};
                const char *mine[] = {"${w_ssid1}", "${w_ssid2}", "${w_ssid3}"};
                id(wifi_ssids).clear();
                for (int i = 0; i < 3; i++) {
                  id(wifi_ssids).push_back(mine[i]);
                  static std::string l[3]; l[i] = std::string(mine[i]) + "\nmove this panel here";
                  lv_label_set_text(lbls[i], l[i].c_str()); lv_obj_clear_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
                }
                for (int i = 3; i < 6; i++) lv_obj_add_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(id(wifi_msg), "Nano not reachable from this network — pick where to look for it.");

  # Tap a network: the Nano switches (root helper, falls back if it fails); 12 s later this panel follows
  # with wifi.configure if it has the key — save: false, so a reboot still uses the configured list.
  - id: wifi_pick
    parameters:
      n: int
    then:
      - lambda: |-
          if (n >= (int) id(wifi_ssids).size()) return;
          id(wifi_target) = id(wifi_ssids)[n];
          static std::string m; m = (id(nano_ok) ? "Moving the Nano to " : "Moving this panel to ") + id(wifi_target) + "…";
          lv_label_set_text(id(wifi_msg), m.c_str());
      - if:
          condition:
            lambda: 'return id(nano_ok);'
          then:
            - http_request.post:
                request_headers: {Authorization: "Bearer ${panel_token}"}
                url: !lambda return id(nano_base) + "/panel/wifi?ssid=" + url_encode(id(wifi_target));
                capture_response: true
                max_response_buffer_size: 512
                on_response:
                  - lambda: |-
                      std::string say = body.substr(0, 160);
                      json::parse_json(body, [&](JsonObject root) -> bool { if (root["say"].is<const char *>()) say = root["say"].as<std::string>(); return true; });
                      if (response->status_code != 200) { lv_label_set_text(id(wifi_msg), say.c_str()); id(wifi_target) = ""; return; }
                      const bool known = (id(wifi_target) == "${w_ssid1}" || id(wifi_target) == "${w_ssid2}" || id(wifi_target) == "${w_ssid3}");
                      static std::string m; m = say + (known ? "  ·  this panel follows in 12 s" : "  ·  this panel has no key for it and stays here");
                      lv_label_set_text(id(wifi_msg), m.c_str());
                      if (!known) id(wifi_target) = "";
                on_error:
                  - lambda: 'lv_label_set_text(id(wifi_msg), "Nano not reachable"); id(wifi_target) = "";'
            - delay: 12s
          else:
            - delay: 1s
      - if:
          condition:
            lambda: 'return !id(wifi_target).empty();'
          then:
            - lambda: 'id(nano_ok) = false; lv_label_set_text(id(status_lbl), "Wi-Fi: joining the Nano network…");'
            - wifi.configure:
                ssid: !lambda return id(wifi_target);
                password: !lambda |-
                  if (id(wifi_target) == "${w_ssid1}") return std::string("${w_pw1}");
                  if (id(wifi_target) == "${w_ssid2}") return std::string("${w_pw2}");
                  return std::string("${w_pw3}");
                save: false
                timeout: 45s
                on_connect:
                  - lambda: 'lv_label_set_text(id(wifi_msg), "Joined — waiting for the Nano beacon…"); lv_scr_load(id(page_start)->obj);'
                on_error:
                  - lambda: 'lv_label_set_text(id(wifi_msg), "Could not join that network — the panel reconnects to what it can find.");'

  # The Nano announced a move (an iPad asked): wait for it to go, then join the same network.
  - id: wifi_follow_go
    then:
      - lambda: |-
          static std::string m; m = "Nano is moving to " + id(wifi_target) + " — following in 12 s";
          lv_label_set_text(id(status_lbl), m.c_str());
      - delay: 12s
      - lambda: 'id(nano_ok) = false; lv_label_set_text(id(status_lbl), "Wi-Fi: joining the Nano network…");'
      - wifi.configure:
          ssid: !lambda return id(wifi_target);
          password: !lambda |-
            if (id(wifi_target) == "${w_ssid1}") return std::string("${w_pw1}");
            if (id(wifi_target) == "${w_ssid2}") return std::string("${w_pw2}");
            return std::string("${w_pw3}");
          save: false
          timeout: 45s
          on_error:
            - lambda: 'lv_label_set_text(id(status_lbl), "Could not join that network — reconnecting to what I can find.");'

  # Pull the Nano-rendered images for the patient page (only for scripts the panel can't draw).
  - id: fetch_images
    then:
      - lambda: 'ESP_LOGI("img", "fetch: phrase=%d replies=%d mic=%d bytes", (int) id(phrase_url).size(), (int) id(replies_url).size(), (int) id(mic_url).size());'
      - online_image.set_url:
          id: img_phrase
          url: !lambda |-
            return id(phrase_url).empty() ? std::string("http://127.0.0.1/none") : id(phrase_url);
      - online_image.set_url:
          id: img_replies
          url: !lambda return id(replies_url);

  - id: fetch_mic
    then:
      - online_image.set_url:
          id: img_mic
          url: !lambda return id(mic_url);
  - id: fetch_heard
    then:
      - online_image.set_url:
          id: img_heard
          url: !lambda return id(phrase_url);

  # The patient's mic button, in their language: "Tap to reply" / "Stop · 12 s" while recording.
  - id: mic_label
    then:
      - lambda: |-
          auto ui = [](int idx, const char *fallback) -> std::string {
            if (idx < 0) return fallback;
            if (!id(ph_trans)[idx].empty()) return id(ph_trans)[idx];
            if (!id(ph_draft)[idx].empty()) return id(ph_draft)[idx];
            return fallback;
          };
          std::string t;
          char secs[16] = "";
          if (id(recording) && id(turn) == 1) {
            snprintf(secs, sizeof secs, "%lu s", (unsigned long) ((millis() - id(rec_started)) / 1000));
            t = "■ " + ui(id(ui_stop), "Stop");
          } else {
            t = "● " + ui(id(ui_reply), "Tap to reply");
          }
          if (lang_script(id(lang_code)) < 0 && !id(ph_trans).empty() && t.size() > 4 && !isascii((unsigned char) t[4])) {
            // rendered by the Nano: hide the text labels, show the image (fetched by fetch_images / on change)
            lv_obj_add_flag(id(reply_mic_lbl), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(reply_mic_lbl_ar), LV_OBJ_FLAG_HIDDEN);
            std::string u = id(nano_base) + "/render?lang=" + id(lang_code) + "&size=18&w=110&lines=2&fg=FFFFFF&bg=" + hex6(lang_colour(id(lang_code))) + "&text=" + url_encode(t);
            if (u != id(mic_url)) { id(mic_url) = u; lv_obj_add_flag(id(mic_img), LV_OBJ_FLAG_HIDDEN); id(need_mic) = true; }
          } else {
            set_text_any(id(reply_mic_lbl), id(reply_mic_lbl_ar), t + (secs[0] ? std::string("  ") + secs : ""));
            lv_obj_add_flag(id(mic_img), LV_OBJ_FLAG_HIDDEN);
          }
          lv_label_set_text(id(mic_timer), secs);
          set_text_any(id(rp_again_lbl), id(rp_again_lbl_ar), ui(id(ui_again), "Reply again"));
          { std::string h = ui(id(ui_hear), "Hear it again");
            if (lang_script(id(lang_code)) < 0 && !h.empty() && !isascii((unsigned char) h[0])) h = "Hear it again";
            set_text_any(id(pt_repeat_lbl), id(pt_repeat_lbl_ar), h); }

  - id: reply_tap
    parameters:
      n: int
    then:
      - lambda: |-
          if (n >= (int) id(replies).size()) return;
          id(set_turn).execute(1);
          set_text_any(id(pt_result), id(pt_result_ar), std::string("…"));
      - http_request.post:
          request_headers: {Authorization: "Bearer ${panel_token}"}
          url: !lambda return id(nano_base) + "/panel/reply/" + id(ph_keys)[id(replies)[n]] + "?lang=" + id(lang_code) + "&src=" + id(src_code);
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            - lambda: |-
                std::string say = body.substr(0, 200);
                json::parse_json(body, [&](JsonObject root) -> bool {
                  if (root["say"].is<const char *>()) say = root["say"].as<std::string>();
                  return true;
                });
                set_text_any(id(pt_result), id(pt_result_ar), std::string(say.c_str()));
                set_text_any(id(heard_lbl), id(heard_lbl_ar), std::string(say.c_str()));
          on_error:
            - lambda: 'set_text_any(id(pt_result), id(pt_result_ar), std::string("Nano not reachable"));'

  - id: tap
    parameters:
      n: int
    then:
      - lambda: |-
          if (n >= (int) id(shown).size()) return;
          int i = id(shown)[n];
          id(last_phrase) = i;
          lv_obj_add_flag(id(offer_btn), LV_OBJ_FLAG_HIDDEN);
          if (!id(rec_mode)) { id(send_phrase).execute(id(ph_keys)[i]); return; }
          if (id(recording) && id(rec_phrase) == i) { id(send_phrase).execute("stop"); return; }
          id(rec_phrase) = i;
          std::string read = id(lang_code) == "en" ? id(ph_texts)[i] : id(ph_trans)[i];
          static std::string msg;
          msg = read.empty() ? "No " + id(lang_code) + " text yet — say it in your own words:\n" + id(ph_texts)[i]
                             : "Read aloud:\n" + read;
          set_text_any(id(said_lbl), id(said_lbl_ar), std::string(msg.c_str()));
          id(send_phrase).execute("record");

  - id: set_mode
    parameters:
      enable: bool
    then:
      - lambda: |-
          const bool on = enable;
          id(rec_mode) = on;
          lv_label_set_text(id(mode_lbl), on ? "Recording as " : "+ Add phrase");
          if (on) { static std::string t; t = "● " + id(spk_id) + " · done"; lv_label_set_text(id(mode_lbl), t.c_str()); }
          lv_obj_set_style_bg_color(id(mode_btn), lv_color_hex(on ? ${c_amber} : ${c_panel}), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(mode_lbl), lv_color_hex(on ? ${c_panel} : ${c_ink}), LV_PART_MAIN);
          set_text_any(id(said_lbl), id(said_lbl_ar), std::string(on ? "Tap a phrase, read it aloud, tap it again (or Stop) to save." : "Tap a phrase to say it."));
          set_text_any(id(heard_lbl), id(heard_lbl_ar), std::string("—"));
          if (on && id(want_rec) >= 0) {                       // "Record it" brought us here: start that take
            int i = id(want_rec); id(want_rec) = -1;
            id(rec_phrase) = i;
            std::string read = id(ph_trans)[i];
            static std::string msg;
            msg = read.empty() ? "No " + id(lang_code) + " text yet — say it in your own words:\n" + id(ph_texts)[i]
                               : "Read aloud:\n" + read;
            set_text_any(id(said_lbl), id(said_lbl_ar), std::string(msg.c_str()));
            id(send_phrase).execute("record");
          }

  # POST /panel/<pid>?lang=xx and route the Nano's reply to the right bubble.
  - id: send_phrase
    parameters:
      pid: string
    then:
      - lambda: |-
          const bool cl = (id(turn) == 0 && !id(rec_mode));
          if (pid == "record") { set_text_any(cl ? id(said_lbl) : id(heard_lbl), cl ? id(said_lbl_ar) : id(heard_lbl_ar), "Listening…"); }
          else if (pid == "stop") { set_text_any(cl ? id(said_lbl) : id(heard_lbl), cl ? id(said_lbl_ar) : id(heard_lbl_ar), "Transcribing…"); }
          else { set_text_any(id(said_lbl), id(said_lbl_ar), std::string("…")); }
      - http_request.post:
          request_headers: {Authorization: "Bearer ${panel_token}"}
          url: !lambda |-
            std::string u = std::string(id(nano_base) + "/panel/") + pid + "?lang=" + id(lang_code) + "&src=" + id(src_code);
            if ((pid == "record" || pid == "stop") && !id(rec_mode)) {   // free speech: whoever's turn it is
              std::string listen = id(turn) == 0 ? id(src_code) : id(lang_code);
              std::string to     = id(turn) == 0 ? id(lang_code) : id(src_code);
              u = std::string(id(nano_base) + "/panel/") + pid + "?lang=" + listen + "&src=" + to + "&speak=1&who=" + (id(turn) == 0 ? "clinician" : "patient");
            }
            if (pid == "record" && id(rec_mode) && id(rec_phrase) >= 0)
              u += "&phrase=" + id(ph_keys)[id(rec_phrase)] + "&speaker=" + id(spk_id) + "&type=" + id(spk_type) + "&consent=1";
            return u;
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            - lambda: |-
                std::string say = body.substr(0, 200);
                bool offer = false;
                json::parse_json(body, [&](JsonObject root) -> bool {
                  if (root["say"].is<const char *>()) say = root["say"].as<std::string>();
                  offer = root["offer_record"] | false;
                  return true;
                });
                if (offer && !id(rec_mode)) lv_obj_clear_flag(id(offer_btn), LV_OBJ_FLAG_HIDDEN);
                if (pid == "record") {
                  id(recording) = true;
                  id(rec_started) = millis();
                  if (id(turn) == 1) { id(mic_label).execute(); if (lang_script(id(lang_code)) < 0) id(need_mic) = true; }
                  lv_label_set_text(id(mic_lbl), "■\nStop");
                  lv_obj_set_style_bg_color(id(mic_btn), lv_color_hex(${c_amber}), LV_PART_MAIN);
                } else if (pid == "stop") {
                  id(recording) = false; id(rec_phrase) = -1;
                  lv_label_set_text(id(mic_lbl), "●\nRecord");
                  lv_obj_set_style_bg_color(id(mic_btn), lv_color_hex(lang_colour(id(turn) == 0 ? id(src_code) : id(lang_code))), LV_PART_MAIN);
                  { const bool cl = (id(turn) == 0 && !id(rec_mode));
                    set_text_any(cl ? id(said_lbl) : id(heard_lbl), cl ? id(said_lbl_ar) : id(heard_lbl_ar), say); }
                  if (id(turn) == 1) set_text_any(id(pt_result), id(pt_result_ar), std::string(say.c_str()));
                  if (id(turn) == 1 && !id(rec_mode)) {
                    std::string heard, translated;
                    json::parse_json(body, [&](JsonObject root) -> bool {
                      if (root["text"].is<const char *>()) heard = root["text"].as<std::string>();
                      if (root["translated"].is<const char *>()) translated = root["translated"].as<std::string>();
                      return true;
                    });
                    if (heard.empty()) heard = say;
                    set_text_any(id(rp_heard), id(rp_heard_ar), heard);
                    set_text_any(id(rp_trans), id(rp_trans_ar), translated.empty() ? "(no translation — is the translator running?)" : translated);
                    char t[48]; snprintf(t, sizeof t, "Reply took %lu s", (unsigned long) ((millis() - id(rec_started)) / 1000));
                    lv_label_set_text(id(rp_time), t);
                    if (lang_script(id(lang_code)) < 0 && !heard.empty()) {
                      lv_obj_add_flag(id(rp_heard), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(rp_heard_ar), LV_OBJ_FLAG_HIDDEN);
                      id(phrase_url) = id(nano_base) + "/render?lang=" + id(lang_code) + "&size=22&w=368&lines=8&align=left&text=" + url_encode(heard);
                      id(need_heard) = true;
                    } else {
                      lv_obj_add_flag(id(rp_heard_img), LV_OBJ_FLAG_HIDDEN);
                    }
                    lv_scr_load(id(page_reply)->obj);
                  }
                  id(mic_label).execute();
                  if (lang_script(id(lang_code)) < 0) id(need_mic) = true;
                  if (id(rec_mode)) id(need_load) = true;             // the new take may add a ● to its phrase
                } else {
                  set_text_any(id(said_lbl), id(said_lbl_ar), std::string(say.c_str()));
                  if (!id(rec_mode) && id(last_phrase) >= 0) {
                    id(last_used) = id(last_phrase);
                    id(render).execute();
                    id(show_patient).execute(id(last_phrase));
                  }
                }
          on_error:
            - lambda: |-
                { const bool h = (pid == "stop" || pid == "record");
                  set_text_any(h ? id(heard_lbl) : id(said_lbl), h ? id(heard_lbl_ar) : id(said_lbl_ar), "Nano not reachable"); }

button:
  - platform: restart
    name: reboot
    id: reboot_btn
  - platform: template          # test hook: open the patient page for phrase 1 in the current pair (web: /button/patient/press)
    name: patient
    on_press:
      - lambda: |-
          if (id(ph_keys).size() > 1) { id(set_turn).execute(0); id(show_patient).execute(1); }
  - platform: template          # test hook: select English → Hindi as if by the wizard
    name: pair_hi
    on_press:
      - lambda: |-
          for (size_t i = 0; i < id(lang_codes).size(); i++) { if (id(lang_codes)[i] == "en") id(src_idx) = i; if (id(lang_codes)[i] == "hi") id(dst_idx) = i; }
          id(apply_pair).execute();

