# Waveshare ESP32-S3-Touch-LCD-7 (Rev 1.2, N16R8) — phrase_recorder touch panel
# Board/display block adapted from github.com/inytar/waveshare-esp32-s3-touch-lcd-7-esphome
substitutions:
  name: phrase-panel
  nano_url: "http://192.168.68.111:8765"   # nano/panel_api.py when on the home LAN (on PhraseKit it is 10.42.0.1)
  wifi_ssid_hint: "gadgetboy2"
  # Palette from docs/project-brief.md §10: clinician = sage, patient = steel blue, brick reserved.
  c_base: "0xF6F4EF"
  c_panel: "0xFFFFFF"
  c_ink: "0x1B2621"
  c_sage: "0x4A7A68"
  c_sage_soft: "0xE3EDE8"
  c_steel: "0x6B7F9E"
  c_steel_soft: "0xE6EAF1"
  c_amber: "0xB8843C"
  c_line: "0xDCD7C9"
  c_muted: "0x8A8474"

esphome:
  name: ${name}
  min_version: "2025.8.0"
  platformio_options:
    board_upload.maximum_ram_size: 524288

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  reboot_timeout: 0s        # no Home Assistant; never reboot for lack of a client
ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret kit_ssid          # the Nano's own hotspot (demo kit) — preferred
      password: !secret kit_password
      priority: 10
    - ssid: !secret wifi_ssid         # home LAN
      password: !secret wifi_password
  on_connect:
    - lambda: |-
        id(nano_base) = std::string([]{ std::array<char, wifi::SSID_BUFFER_SIZE> b; return std::string(wifi::global_wifi_component->wifi_ssid_to(b)); }()) == "PhraseKit" ? "http://10.42.0.1:8765" : "${nano_url}";
        id(nano_ok) = false;
        id(check_nano).execute();
  ap:
    ssid: "phrase-panel setup"
captive_portal:

web_server:
  port: 80

json:

http_request:
  verify_ssl: false
  timeout: 30s          # stop → Whisper can take a few seconds

i2c:
  sda: GPIO08
  scl: GPIO09
  scan: true
  id: bus_a

ch422g:
  - id: ch422g_hub

output:
  - platform: gpio
    id: lcdbacklight_output
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true

light:
  - platform: binary
    output: lcdbacklight_output
    id: lcdbacklight
    name: LCD Backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red:   [1, 2, 42, 41, 40]
      green: [39, 0, 45, 48, 47, 21]
      blue:  [14, 38, 18, 17, 10]

touchscreen:
  platform: gt911
  id: waveshare_touch
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  on_touch:
    - lambda: ESP_LOGI("touch", "x=%d y=%d", touch.x, touch.y);



# Inter from Google Fonts: LVGL's built-in font has no macrons, and the Nano sends Te Reo text.
font:
  - file: gfonts://Inter
    id: ui_28
    size: 28
    bpp: 4
    glyphs: &glyphs " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĀāĒēĪīŌōŪū…→°●■↓‹›✓✗·"
  - file: gfonts://Inter
    id: ui_22
    size: 22
    bpp: 4
    glyphs: *glyphs
  - file: gfonts://Inter
    id: ui_18
    size: 18
    bpp: 4
    glyphs: *glyphs
  - file: gfonts://Inter
    id: ui_14
    size: 14
    bpp: 4
    glyphs: *glyphs

# Everything the screen shows comes from GET /phrases on the Nano (see nano/panel_api.py).
globals:
  - {id: src_idx,    type: int, restore_value: true, initial_value: '-1'}   # "I speak" language (index into lang_codes)
  - {id: dst_idx,    type: int, restore_value: true, initial_value: '-1'}   # "Translate to" language
  - {id: src_code,   type: std::string, initial_value: '"en"'}
  - {id: lang_code,  type: std::string, initial_value: '"en"'}             # = dst: what the Nano speaks / listens for
  - {id: lang_step,  type: int, initial_value: '0'}                         # wizard: 0 = choosing src, 1 = choosing dst
  - {id: turn,       type: int, initial_value: '0'}                         # 0 = clinician ("I speak") talking, 1 = patient
  - {id: nano_base,  type: std::string, initial_value: '"${nano_url}"'}     # set from the SSID on connect
  - {id: nano_ok,    type: bool, initial_value: 'false'}
  - {id: polling,    type: bool, initial_value: 'false'}
  - {id: last_tap,   type: uint32_t, initial_value: '0'}
  - {id: cat_filter, type: std::string, initial_value: '""'}               # "" = all categories
  - {id: page,       type: int, initial_value: '0'}
  - {id: recording,  type: bool, initial_value: 'false'}
  - {id: lang_codes, type: 'std::vector<std::string>'}
  - {id: lang_names, type: 'std::vector<std::string>'}
  - {id: cat_slugs,  type: 'std::vector<std::string>'}
  - {id: ph_keys,    type: 'std::vector<std::string>'}            # all phrases, in phrases.json order
  - {id: ph_texts,   type: 'std::vector<std::string>'}            # English (the canonical text)
  - {id: ph_src,     type: 'std::vector<std::string>'}            # text in the "I speak" language ("" if none)
  - {id: ph_trans,   type: 'std::vector<std::string>'}            # text in the "Translate to" language ("" if none)
  - {id: ph_cats,    type: 'std::vector<std::string>'}
  - {id: ph_rec,     type: 'std::vector<bool>'}
  - {id: shown,      type: 'std::vector<int>'}                    # indices of the phrases on the current page
  - {id: rec_mode,   type: bool, initial_value: 'false'}           # false = Speak, true = Record (volunteer takes)
  - {id: spk_id,     type: std::string, initial_value: '""'}
  - {id: spk_type,   type: std::string, initial_value: '"native"'}
  - {id: consented,  type: bool, initial_value: 'false'}
  - {id: rec_phrase, type: int, initial_value: '-1'}               # phrase index being recorded, or -1
  - {id: want_rec,   type: int, initial_value: '-1'}               # phrase queued by "Record it" until Record mode is on
  - {id: last_phrase, type: int, initial_value: '-1'}              # phrase index of the last tap (for the offer)

lvgl:
  displays: [waveshare_display]
  touchscreens: [waveshare_touch]
  buffer_size: 25%
  theme:
    button:
      radius: 14
      bg_color: "${c_panel}"
      border_color: "${c_sage}"
      border_width: 2
      text_color: "${c_ink}"
      text_font: ui_22
      shadow_width: 0
      pressed:
        bg_color: "${c_sage_soft}"
    dropdown:
      bg_color: "${c_panel}"
      border_color: "${c_line}"
      border_width: 1
      radius: 10
      text_color: "${c_ink}"
      text_font: ui_18
  pages:
    # ================= 1. start =================
    - id: page_start
      bg_color: "${c_base}"
      widgets:
        - label: {align: TOP_LEFT, x: 16, y: 14, text_font: ui_22, text_color: "${c_ink}", text: "Phrase Recorder"}
        - label: {id: status_lbl, align: TOP_RIGHT, x: -16, y: 18, text_font: ui_18, text_color: "${c_muted}", text: "Wi-Fi: connecting…"}
        - button:
            id: shutdown_btn
            align: BOTTOM_RIGHT
            x: -16
            y: -12
            width: 200
            height: 44
            pad_all: 0
            border_color: "${c_line}"
            widgets: [{label: {id: shutdown_lbl, align: CENTER, text_font: ui_14, text_color: "${c_muted}", text: "hold to shut down the Nano"}}]
            on_long_press:
              - lambda: 'lv_label_set_text(id(shutdown_lbl), "shutting down…");'
              - http_request.post:
                  url: !lambda return id(nano_base) + "/panel/shutdown";
                  on_response:
                    - lambda: 'lv_label_set_text(id(shutdown_lbl), "Nano is shutting down — unplug it in 20 s"); id(nano_ok) = false;'
                  on_error:
                    - lambda: 'lv_label_set_text(id(shutdown_lbl), "Nano not reachable");'
        - button:
            align: CENTER
            y: -40
            width: 560
            height: 190
            bg_color: "${c_sage}"
            border_width: 0
            radius: 24
            pressed: {bg_color: "0x3B6354"}
            widgets:
              - label: {align: CENTER, y: -14, text_font: ui_28, text_color: "${c_panel}", text: "I speak…"}
              - label: {align: CENTER, y: 30, text_font: ui_18, text_color: "0xD8E6DF", text: "tap to choose the languages"}
            on_click:
              - lambda: 'id(lang_step) = 0; id(show_langs).execute();'
        - button:
            id: resume_btn
            align: CENTER
            y: 120
            width: 560
            height: 64
            hidden: true
            widgets:
              - label: {id: resume_lbl, align: CENTER, text_font: ui_18, text: ""}
            on_click:
              - lambda: 'id(apply_pair).execute();'
    # ================= 2b. "Translate to…" — its own screen so the step is unmistakable ==========
    - id: page_to
      bg_color: "${c_base}"
      widgets:
        - label: {align: TOP_LEFT, x: 16, y: 14, text_font: ui_22, text_color: "${c_ink}", text: "Phrase Recorder"}
        - obj: {id: to_src_chip, align: TOP_RIGHT, x: -16, y: 10, width: 220, height: 44, bg_color: "${c_sage}", border_width: 0, radius: 12, pad_all: 0,
                widgets: [{label: {id: to_src_lbl, align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "I speak English"}}]}
        - button:
            align: CENTER
            y: -40
            width: 560
            height: 190
            bg_color: "${c_steel}"
            border_width: 0
            radius: 24
            pressed: {bg_color: "0x56698A"}
            widgets:
              - label: {align: CENTER, y: -14, text_font: ui_28, text_color: "${c_panel}", text: "Translate to…"}
              - label: {align: CENTER, y: 30, text_font: ui_18, text_color: "0xDCE2EC", text: "tap to choose the patient's language"}
            on_click:
              - lambda: 'id(lang_step) = 1; id(show_langs).execute();'
        - button:
            align: CENTER
            y: 120
            width: 560
            height: 64
            widgets: [{label: {align: CENTER, text_font: ui_18, text: "Back — change the language I speak"}}]
            on_click:
              - lambda: 'id(lang_step) = 0; id(show_langs).execute();'
    # ================= 2/3. pick a language (used for both steps) =================
    - id: page_lang
      bg_color: "${c_base}"
      widgets:
        - label: {id: lang_title, align: TOP_LEFT, x: 16, y: 8, text_font: ui_28, text_color: "${c_sage}", text: "I speak"}
        - label: {id: lang_sub, align: TOP_LEFT, x: 16, y: 44, text_font: ui_18, text_color: "${c_muted}", text: "Step 1 of 2 — the clinician's language"}
        - button:
            align: TOP_RIGHT
            x: -12
            y: 8
            width: 120
            height: 44
            pad_all: 0
            widgets: [{label: {align: CENTER, text_font: ui_18, text: "Back"}}]
            on_click:
              - lambda: |-
                  if (id(lang_step) == 1) { lv_scr_load(id(page_to)->obj); }
                  else { lv_scr_load(id(page_start)->obj); }
        - obj:
            id: lang_grid
            align: TOP_MID
            y: 70
            width: 776
            height: 398
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout: {type: grid, grid_columns: [FR(1), FR(1), FR(1), FR(1), FR(1)], grid_rows: [FR(1), FR(1), FR(1), FR(1)], pad_column: 8, pad_row: 8}
            widgets:
              - button: {id: g1, grid_cell_column_pos: 0, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl1, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(0);"}}
              - button: {id: g2, grid_cell_column_pos: 1, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl2, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(1);"}}
              - button: {id: g3, grid_cell_column_pos: 2, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl3, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(2);"}}
              - button: {id: g4, grid_cell_column_pos: 3, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl4, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(3);"}}
              - button: {id: g5, grid_cell_column_pos: 4, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl5, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(4);"}}
              - button: {id: g6, grid_cell_column_pos: 0, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl6, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(5);"}}
              - button: {id: g7, grid_cell_column_pos: 1, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl7, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(6);"}}
              - button: {id: g8, grid_cell_column_pos: 2, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl8, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(7);"}}
              - button: {id: g9, grid_cell_column_pos: 3, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl9, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(8);"}}
              - button: {id: g10, grid_cell_column_pos: 4, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl10, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(9);"}}
              - button: {id: g11, grid_cell_column_pos: 0, grid_cell_row_pos: 2, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl11, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(10);"}}
              - button: {id: g12, grid_cell_column_pos: 1, grid_cell_row_pos: 2, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl12, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(11);"}}
              - button: {id: g13, grid_cell_column_pos: 2, grid_cell_row_pos: 2, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl13, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(12);"}}
              - button: {id: g14, grid_cell_column_pos: 3, grid_cell_row_pos: 2, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl14, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(13);"}}
              - button: {id: g15, grid_cell_column_pos: 4, grid_cell_row_pos: 2, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl15, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(14);"}}
              - button: {id: g16, grid_cell_column_pos: 0, grid_cell_row_pos: 3, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl16, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(15);"}}
              - button: {id: g17, grid_cell_column_pos: 1, grid_cell_row_pos: 3, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl17, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(16);"}}
              - button: {id: g18, grid_cell_column_pos: 2, grid_cell_row_pos: 3, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl18, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(17);"}}
              - button: {id: g19, grid_cell_column_pos: 3, grid_cell_row_pos: 3, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl19, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(18);"}}
              - button: {id: g20, grid_cell_column_pos: 4, grid_cell_row_pos: 3, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 4, widgets: [{label: {id: gl20, align: CENTER, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_18, text: ""}}], on_click: {lambda: "id(pick_lang).execute(19);"}}
    # ================= 4. conversation =================
    - id: main_page
      bg_color: "${c_base}"
      pad_all: 0
      widgets:
        # ---- header: language pair (tap to change) | mode | category ----
        - obj: {id: src_chip, align: TOP_LEFT, x: 12, y: 10, width: 124, height: 44, bg_color: "${c_sage}", border_width: 0, radius: 12, pad_all: 0, clickable: true,
                outline_width: 0, outline_color: "${c_sage}", outline_pad: 3,
                widgets: [{label: {id: src_lbl, align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "English"}}],
                on_click: {lambda: "id(set_turn).execute(0);"}}
        - label: {align: TOP_LEFT, x: 144, y: 20, text_font: ui_22, text_color: "${c_muted}", text: "→"}
        - obj: {id: dst_chip, align: TOP_LEFT, x: 170, y: 10, width: 124, height: 44, bg_color: "${c_steel}", border_width: 0, radius: 12, pad_all: 0, clickable: true,
                outline_width: 0, outline_color: "${c_steel}", outline_pad: 3,
                widgets: [{label: {id: dst_lbl, align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "…"}}],
                on_click: {lambda: "id(set_turn).execute(1);"}}
        - button: {align: TOP_LEFT, x: 302, y: 10, width: 70, height: 44, pad_all: 0, border_color: "${c_line}",
                   widgets: [{label: {align: CENTER, text_font: ui_14, text_color: "${c_muted}", text: "change"}}],
                   on_click: {lambda: "lv_scr_load(id(page_start)->obj);"}}
        - button:
            id: mode_btn
            align: TOP_RIGHT
            x: -212
            y: 10
            width: 190
            height: 44
            pad_all: 0
            widgets:
              - label: {id: mode_lbl, align: CENTER, text_font: ui_18, text: "Speak  ·  Record"}
            on_click:
              - lambda: |-
                  if (id(rec_mode)) { id(set_mode).execute(false); }
                  else if (id(consented) && !id(spk_id).empty()) { id(set_mode).execute(true); }
                  else { lv_obj_clear_flag(id(vol_sheet), LV_OBJ_FLAG_HIDDEN); }
        - dropdown:
            id: cat_dd
            align: TOP_RIGHT
            x: -12
            y: 10
            width: 200
            height: 44
            symbol: "↓"
            options: ["All categories"]
            dropdown_list: {text_font: ui_18, bg_color: "${c_panel}", text_color: "${c_ink}", max_height: 380}
            on_value:
              - lambda: |-
                  id(cat_filter) = x == 0 ? std::string("") : id(cat_slugs)[x - 1];
                  id(page) = 0;
                  id(render).execute();
        # ---- phrase grid: 3 x 2 per page, arrows either side ----
        - button: {id: prev_btn, align: LEFT_MID, x: 8, y: -40, width: 36, height: 120, border_width: 0, bg_color: "${c_base}", pad_all: 0, hidden: true,
                   widgets: [{label: {align: CENTER, text: "‹", text_font: ui_28, text_color: "${c_muted}"}}],
                   on_click: {lambda: "id(page)--; id(render).execute();"}}
        - button: {id: next_btn, align: RIGHT_MID, x: -8, y: -40, width: 36, height: 120, border_width: 0, bg_color: "${c_base}", pad_all: 0, hidden: true,
                   widgets: [{label: {align: CENTER, text: "›", text_font: ui_28, text_color: "${c_muted}"}}],
                   on_click: {lambda: "id(page)++; id(render).execute();"}}
        - obj:
            id: grid
            align: TOP_MID
            y: 64
            width: 700
            height: 280
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout: {type: grid, grid_columns: [FR(1), FR(1), FR(1)], grid_rows: [FR(1), FR(1)], pad_column: 10, pad_row: 10}
            widgets:
              - button: {id: b1, grid_cell_column_pos: 0, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k1, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l1, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(0);"}}
              - button: {id: b2, grid_cell_column_pos: 1, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k2, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l2, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(1);"}}
              - button: {id: b3, grid_cell_column_pos: 2, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k3, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l3, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(2);"}}
              - button: {id: b4, grid_cell_column_pos: 0, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k4, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l4, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(3);"}}
              - button: {id: b5, grid_cell_column_pos: 1, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k5, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l5, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(4);"}}
              - button: {id: b6, grid_cell_column_pos: 2, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k6, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l6, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(5);"}}
        # ---- conversation row: clinician (sage, left) | heard (steel, right) | mic ----
        - obj:
            id: said_box
            align: BOTTOM_LEFT
            x: 12
            y: -12
            width: 356
            height: 104
            bg_color: "${c_panel}"
            border_color: "${c_sage}"
            border_width: 2
            radius: 12
            pad_all: 8
            widgets:
              - label: {id: said_who, align: TOP_LEFT, text: "Clinician", text_font: ui_18, text_color: "${c_sage}"}
              - button:
                  id: offer_btn
                  align: TOP_RIGHT
                  width: 110
                  height: 36
                  pad_all: 0
                  hidden: true
                  bg_color: "${c_amber}"
                  border_width: 0
                  widgets: [{label: {align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "Record it"}}]
                  on_click:
                    - lambda: |-
                        lv_obj_add_flag(id(offer_btn), LV_OBJ_FLAG_HIDDEN);
                        id(want_rec) = id(last_phrase);
                        if (id(consented) && !id(spk_id).empty()) { id(set_mode).execute(true); }
                        else { lv_obj_clear_flag(id(vol_sheet), LV_OBJ_FLAG_HIDDEN); }
              - label: {id: said_lbl, align: BOTTOM_LEFT, width: 100%, long_mode: WRAP, text_font: ui_18, text_color: "${c_ink}", text: "Tap a phrase to say it."}
        - obj:
            id: heard_box
            align: BOTTOM_LEFT
            x: 380
            y: -12
            width: 296
            height: 104
            bg_color: "${c_panel}"
            border_color: "${c_steel}"
            border_width: 2
            radius: 12
            pad_all: 8
            widgets:
              - label: {id: heard_who, align: TOP_RIGHT, text: "Heard", text_font: ui_18, text_color: "${c_steel}"}
              - label: {id: heard_lbl, align: BOTTOM_LEFT, width: 100%, long_mode: WRAP, text_font: ui_18, text_color: "${c_ink}", text: "—"}
        - button:
            id: mic_btn
            align: BOTTOM_RIGHT
            x: -12
            y: -12
            width: 96
            height: 104
            bg_color: "${c_steel}"
            border_width: 0
            widgets:
              - label: {id: mic_lbl, align: CENTER, text_align: CENTER, text_font: ui_18, text_color: "${c_panel}", text: "●\nRecord"}
            on_click:
              - lambda: |-
                  id(send_phrase).execute(id(recording) ? "stop" : "record");
        # ---- volunteer sheet: shown once before Record mode ----------------------------
        - obj:
            id: vol_sheet
            align: CENTER
            width: 800
            height: 480
            hidden: true
            bg_color: "${c_base}"
            border_width: 0
            radius: 0
            pad_all: 12
            widgets:
              - label: {align: TOP_LEFT, x: 4, y: 0, text_font: ui_22, text_color: "${c_ink}", text: "Volunteer recording"}
              - label: {align: TOP_LEFT, x: 4, y: 40, text_font: ui_18, text_color: "${c_muted}", text: "Your initials (2–12 letters/digits)"}
              - textarea:
                  id: spk_ta
                  align: TOP_LEFT
                  x: 4
                  y: 64
                  width: 220
                  height: 44
                  one_line: true
                  max_length: 12
                  accepted_chars: "abcdefghijklmnopqrstuvwxyz0123456789"
                  text_font: ui_22
                  placeholder_text: "e.g. mg"
              - label: {align: TOP_LEFT, x: 244, y: 40, text_font: ui_18, text_color: "${c_muted}", text: "I am a"}
              - dropdown:
                  id: type_dd
                  align: TOP_LEFT
                  x: 244
                  y: 64
                  width: 220
                  height: 44
                  symbol: "↓"
                  options: ["native speaker", "fluent speaker", "learner", "staff"]
                  dropdown_list: {text_font: ui_18, bg_color: "${c_panel}", text_color: "${c_ink}"}
                  on_value:
                    - lambda: |-
                        static const char *t[] = {"native", "fluent", "learner", "staff"};
                        id(spk_type) = t[x];
              - label:
                  align: TOP_LEFT
                  x: 4
                  y: 116
                  width: 460
                  long_mode: WRAP
                  text_font: ui_18
                  text_color: "${c_ink}"
                  text: "I confirm I am recording my own voice reading clinical phrases for the local medical interpreter project. I agree these recordings may be stored on the practice's own equipment and used to test and train its interpretation system. No patient information is involved. I can ask for my recordings to be deleted by quoting my speaker ID."
              - checkbox:
                  id: consent_cb
                  align: TOP_LEFT
                  x: 4
                  y: 262
                  text: " I agree"
                  text_font: ui_22
                  text_color: "${c_ink}"
                  on_value:
                    - lambda: 'id(consented) = x;'
              - button:
                  align: BOTTOM_LEFT
                  x: 4
                  y: -4
                  width: 150
                  height: 52
                  widgets: [{label: {align: CENTER, text: "Cancel"}}]
                  on_click:
                    - lambda: 'lv_obj_add_flag(id(vol_sheet), LV_OBJ_FLAG_HIDDEN);'
              - button:
                  id: start_btn
                  align: BOTTOM_LEFT
                  x: 170
                  y: -4
                  width: 290
                  height: 52
                  bg_color: "${c_sage}"
                  widgets: [{label: {align: CENTER, text: "Start recording", text_color: "${c_panel}"}}]
                  on_click:
                    - lambda: |-
                        std::string sid = lv_textarea_get_text(id(spk_ta));
                        if (sid.size() < 2) { lv_textarea_set_placeholder_text(id(spk_ta), "initials?"); return; }
                        if (!id(consented)) { lv_obj_set_style_text_color(id(consent_cb), lv_color_hex(0xA63D40), LV_PART_MAIN); return; }
                        id(spk_id) = sid;
                        lv_obj_add_flag(id(vol_sheet), LV_OBJ_FLAG_HIDDEN);
                        id(set_mode).execute(true);
              - keyboard:
                  id: kb
                  align: RIGHT_MID
                  x: 0
                  width: 300
                  height: 440
                  textarea: spk_ta
                  mode: TEXT_LOWER

interval:
  - interval: 5s
    then:
      - script.execute: check_nano
  - interval: 600ms
    then:
      - lambda: |-
          static bool on = false; on = !on;
          lv_obj_t *chip = id(turn) == 0 ? id(src_chip) : id(dst_chip);
          lv_obj_set_style_outline_width(chip, on ? 4 : 0, LV_PART_MAIN);

script:
  - id: check_nano
    then:
      - lambda: |-
          static std::string st;
          if (!wifi::global_wifi_component->is_connected()) {
            st = "Wi-Fi: looking for PhraseKit / " + std::string("${wifi_ssid_hint}") + "…";
            lv_label_set_text(id(status_lbl), st.c_str());
            id(nano_ok) = false;
            return;
          }
          if (id(polling)) return;
          id(polling) = true;
      - http_request.get:
          url: !lambda return id(nano_base) + "/health";
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            - lambda: |-
                id(polling) = false;
                bool whisper = false, piper = false, llama = false, db = false;
                json::parse_json(body, [&](JsonObject r) -> bool {
                  whisper = r["whisper"] | false; piper = r["piper"] | false; llama = r["llama"] | false; db = r["db"] | false;
                  return true;
                });
                static std::string st;
                st = "Wi-Fi: " + std::string([]{ std::array<char, wifi::SSID_BUFFER_SIZE> b; return std::string(wifi::global_wifi_component->wifi_ssid_to(b)); }()) + " ✓  ·  Nano ✓  ·  speech " + (whisper && piper ? "✓" : "✗")
                   + "  ·  translator " + (llama ? "✓" : "starting…") + "  ·  db " + (db ? "✓" : "✗");
                lv_label_set_text(id(status_lbl), st.c_str());
                bool first = !id(nano_ok);
                id(nano_ok) = true;
                if (first || id(ph_keys).empty()) id(load_phrases).execute();
          on_error:
            - lambda: |-
                id(polling) = false;
                id(nano_ok) = false;
                static std::string st;
                st = "Wi-Fi: " + std::string([]{ std::array<char, wifi::SSID_BUFFER_SIZE> b; return std::string(wifi::global_wifi_component->wifi_ssid_to(b)); }()) + " ✓  ·  Nano: not reachable yet…";
                lv_label_set_text(id(status_lbl), st.c_str());

  # Fetch the phrase list for the current language and rebuild the dropdowns + grid.
  - id: load_phrases
    then:
      - http_request.get:
          url: !lambda return std::string(id(nano_base) + "/phrases?lang=") + id(lang_code) + "&src=" + id(src_code);
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            - lambda: |-
                json::parse_json(body, [](JsonObject root) -> bool {
                  std::string copts = "All categories";
                  id(lang_codes).clear(); id(lang_names).clear();
                  for (JsonObject l : root["languages"].as<JsonArray>()) {
                    id(lang_codes).push_back(l["code"].as<std::string>());
                    id(lang_names).push_back(l["label"].as<std::string>());
                  }
                  id(cat_slugs).clear();
                  for (JsonObject c : root["categories"].as<JsonArray>()) {
                    id(cat_slugs).push_back(c["slug"].as<std::string>());
                    copts += "\n"; copts += c["label"].as<std::string>();
                  }
                  id(ph_keys).clear(); id(ph_texts).clear(); id(ph_cats).clear(); id(ph_rec).clear(); id(ph_trans).clear(); id(ph_src).clear();
                  for (JsonObject p : root["phrases"].as<JsonArray>()) {
                    id(ph_trans).push_back(p["translation"].is<const char *>() ? p["translation"].as<std::string>() : std::string());
                    id(ph_src).push_back(p["src_text"].is<const char *>() ? p["src_text"].as<std::string>() : std::string());
                    id(ph_keys).push_back(p["key"].as<std::string>());
                    id(ph_texts).push_back(p["text"].as<std::string>());
                    id(ph_cats).push_back(p["category"].as<std::string>());
                    id(ph_rec).push_back(p["recording"].as<bool>());
                  }
                  int ci = lv_dropdown_get_selected(id(cat_dd)->obj);
                  lv_dropdown_set_options(id(cat_dd)->obj, copts.c_str());
                  lv_dropdown_set_selected(id(cat_dd)->obj, ci);
                  return true;
                });
                // a remembered pair from last time → offer to resume
                int n = id(lang_codes).size();
                if (id(src_idx) >= 0 && id(src_idx) < n && id(dst_idx) >= 0 && id(dst_idx) < n) {
                  static std::string r; r = "Resume  " + id(lang_names)[id(src_idx)] + "  →  " + id(lang_names)[id(dst_idx)];
                  lv_label_set_text(id(resume_lbl), r.c_str());
                  lv_obj_clear_flag(id(resume_btn), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(resume_btn), LV_OBJ_FLAG_HIDDEN);
                }
                id(render).execute();
          on_error:
            - lambda: 'lv_label_set_text(id(said_lbl), "Nano not reachable — check it is on.");'

  # Lay the current page of the (filtered) phrase list onto the nine buttons.
  - id: render
    then:
      - lambda: |-
          lv_obj_t *btns[] = {id(b1), id(b2), id(b3), id(b4), id(b5), id(b6)};
          lv_obj_t *lbls[] = {id(l1), id(l2), id(l3), id(l4), id(l5), id(l6)};
          lv_obj_t *keys[] = {id(k1), id(k2), id(k3), id(k4), id(k5), id(k6)};
          const int PER = 6;
          std::vector<int> match;
          for (size_t i = 0; i < id(ph_keys).size(); i++)
            if (id(cat_filter).empty() || id(ph_cats)[i] == id(cat_filter)) match.push_back(i);
          int pages = std::max(1, ((int) match.size() + PER - 1) / PER);
          if (id(page) >= pages) id(page) = pages - 1;
          if (id(page) < 0) id(page) = 0;
          id(shown).clear();
          for (int n = 0; n < PER; n++) {
            int m = id(page) * PER + n;
            if (m < (int) match.size()) {
              int i = match[m];
              id(shown).push_back(i);
              std::string t = id(ph_src)[i].empty() ? id(ph_texts)[i] : id(ph_src)[i];
              if (t.size() > 64) t = t.substr(0, 63) + "…";
              if (id(ph_rec)[i]) t += "  ●";                 // a native recording exists in this language
              lv_label_set_text(lbls[n], t.c_str());
              lv_label_set_text(keys[n], id(ph_keys)[i].c_str());
              lv_obj_clear_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            }
          }
          if (id(page) > 0) lv_obj_clear_flag(id(prev_btn), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(prev_btn), LV_OBJ_FLAG_HIDDEN);
          if (id(page) < pages - 1) lv_obj_clear_flag(id(next_btn), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(next_btn), LV_OBJ_FLAG_HIDDEN);

  # Wizard: lay the languages on the 20 buttons, coloured for the step (sage = I speak, steel = translate to).
  - id: show_langs
    then:
      - lambda: |-
          lv_obj_t *btns[] = {id(g1), id(g2), id(g3), id(g4), id(g5), id(g6), id(g7), id(g8), id(g9), id(g10), id(g11), id(g12), id(g13), id(g14), id(g15), id(g16), id(g17), id(g18), id(g19), id(g20)};
          lv_obj_t *lbls[] = {id(gl1), id(gl2), id(gl3), id(gl4), id(gl5), id(gl6), id(gl7), id(gl8), id(gl9), id(gl10), id(gl11), id(gl12), id(gl13), id(gl14), id(gl15), id(gl16), id(gl17), id(gl18), id(gl19), id(gl20)};
          const bool to = id(lang_step) == 1;
          lv_label_set_text(id(lang_title), to ? "Translate to" : "I speak");
          lv_obj_set_style_text_color(id(lang_title), lv_color_hex(to ? ${c_steel} : ${c_sage}), LV_PART_MAIN);
          static std::string sub;
          sub = to ? "Step 2 of 2 — the patient's language  (you speak " + id(lang_names)[id(src_idx)] + ")"
                   : "Step 1 of 2 — the clinician's language";
          lv_label_set_text(id(lang_sub), sub.c_str());
          for (int n = 0; n < 20; n++) {
            if (n < (int) id(lang_names).size() && !(to && n == id(src_idx))) {   // never the same language twice
              lv_label_set_text(lbls[n], id(lang_names)[n].c_str());
              lv_obj_set_style_border_color(btns[n], lv_color_hex(to ? ${c_steel} : ${c_sage}), LV_PART_MAIN);
              lv_obj_set_style_bg_color(btns[n], lv_color_hex(to ? ${c_steel_soft} : ${c_sage_soft}), LV_STATE_PRESSED);
              lv_obj_clear_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(btns[n], LV_OBJ_FLAG_HIDDEN);
            }
          }
          lv_scr_load(id(page_lang)->obj);

  - id: pick_lang
    parameters:
      n: int
    then:
      - lambda: |-
          if (n >= (int) id(lang_codes).size()) return;
          if (millis() - id(last_tap) < 500) return;          // one tap = one step
          id(last_tap) = millis();
          if (id(lang_step) == 0) {
            id(src_idx) = n;
            static std::string t; t = "I speak " + id(lang_names)[n];
            lv_label_set_text(id(to_src_lbl), t.c_str());
            lv_scr_load(id(page_to)->obj);
            return;
          }
          if (n == id(src_idx)) return;
          id(dst_idx) = n;
          id(apply_pair).execute();

  # Make the chosen pair live: chips in the header, texts reloaded, conversation screen shown.
  - id: apply_pair
    then:
      - lambda: |-
          id(src_code) = id(lang_codes)[id(src_idx)];
          id(lang_code) = id(lang_codes)[id(dst_idx)];
          lv_label_set_text(id(src_lbl), id(lang_names)[id(src_idx)].c_str());
          lv_label_set_text(id(dst_lbl), id(lang_names)[id(dst_idx)].c_str());
          lv_label_set_text(id(said_lbl), "Tap a phrase to say it.");
          lv_label_set_text(id(heard_lbl), "—");
          id(page) = 0;
          id(set_turn).execute(0);
          lv_scr_load(id(main_page)->obj);
          id(load_phrases).execute();

  # Whose turn: the active chip pulses (see interval:), the mic takes that side's colour.
  - id: set_turn
    parameters:
      t: int
    then:
      - lambda: |-
          id(turn) = t;
          lv_obj_set_style_bg_color(id(mic_btn), lv_color_hex(t == 0 ? ${c_sage} : ${c_steel}), LV_PART_MAIN);
          lv_obj_set_style_outline_width(t == 0 ? id(dst_chip) : id(src_chip), 0, LV_PART_MAIN);
          static std::string m;
          m = t == 0 ? "Clinician speaking — tap a phrase, or hold the mic to say something else"
                     : "Patient speaking — tap the mic, then Stop";
          lv_label_set_text(id(said_lbl), m.c_str());

  - id: tap
    parameters:
      n: int
    then:
      - lambda: |-
          if (n >= (int) id(shown).size()) return;
          int i = id(shown)[n];
          id(last_phrase) = i;
          lv_obj_add_flag(id(offer_btn), LV_OBJ_FLAG_HIDDEN);
          if (!id(rec_mode)) { id(send_phrase).execute(id(ph_keys)[i]); return; }
          if (id(recording) && id(rec_phrase) == i) { id(send_phrase).execute("stop"); return; }
          id(rec_phrase) = i;
          std::string read = id(lang_code) == "en" ? id(ph_texts)[i] : id(ph_trans)[i];
          static std::string msg;
          msg = read.empty() ? "No " + id(lang_code) + " text yet — say it in your own words:\n" + id(ph_texts)[i]
                             : "Read aloud:\n" + read;
          lv_label_set_text(id(said_lbl), msg.c_str());
          id(send_phrase).execute("record");

  - id: set_mode
    parameters:
      enable: bool
    then:
      - lambda: |-
          const bool on = enable;
          id(rec_mode) = on;
          lv_label_set_text(id(mode_lbl), on ? "Recording as " : "Speak  ·  Record");
          if (on) { static std::string t; t = "● Record mode · " + id(spk_id); lv_label_set_text(id(mode_lbl), t.c_str()); }
          lv_obj_set_style_bg_color(id(mode_btn), lv_color_hex(on ? ${c_amber} : ${c_panel}), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(mode_lbl), lv_color_hex(on ? ${c_panel} : ${c_ink}), LV_PART_MAIN);
          lv_label_set_text(id(said_lbl), on ? "Tap a phrase, read it aloud, tap it again (or Stop) to save." : "Tap a phrase to say it.");
          lv_label_set_text(id(heard_lbl), "—");
          if (on && id(want_rec) >= 0) {                       // "Record it" brought us here: start that take
            int i = id(want_rec); id(want_rec) = -1;
            id(rec_phrase) = i;
            std::string read = id(ph_trans)[i];
            static std::string msg;
            msg = read.empty() ? "No " + id(lang_code) + " text yet — say it in your own words:\n" + id(ph_texts)[i]
                               : "Read aloud:\n" + read;
            lv_label_set_text(id(said_lbl), msg.c_str());
            id(send_phrase).execute("record");
          }

  # POST /panel/<pid>?lang=xx and route the Nano's reply to the right bubble.
  - id: send_phrase
    parameters:
      pid: string
    then:
      - lambda: |-
          lv_obj_t *box = (id(turn) == 0 && !id(rec_mode)) ? id(said_lbl) : id(heard_lbl);
          if (pid == "record") { lv_label_set_text(box, "Listening…"); }
          else if (pid == "stop") { lv_label_set_text(box, "Transcribing…"); }
          else { lv_label_set_text(id(said_lbl), "…"); }
      - http_request.post:
          url: !lambda |-
            std::string u = std::string(id(nano_base) + "/panel/") + pid + "?lang=" + id(lang_code) + "&src=" + id(src_code);
            if ((pid == "record" || pid == "stop") && !id(rec_mode)) {   // free speech: whoever's turn it is
              std::string listen = id(turn) == 0 ? id(src_code) : id(lang_code);
              std::string to     = id(turn) == 0 ? id(lang_code) : id(src_code);
              u = std::string(id(nano_base) + "/panel/") + pid + "?lang=" + listen + "&src=" + to + "&speak=1";
            }
            if (pid == "record" && id(rec_mode) && id(rec_phrase) >= 0)
              u += "&phrase=" + id(ph_keys)[id(rec_phrase)] + "&speaker=" + id(spk_id) + "&type=" + id(spk_type) + "&consent=1";
            return u;
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            - lambda: |-
                std::string say = body.substr(0, 200);
                bool offer = false;
                json::parse_json(body, [&](JsonObject root) -> bool {
                  if (root["say"].is<const char *>()) say = root["say"].as<std::string>();
                  offer = root["offer_record"] | false;
                  return true;
                });
                if (offer && !id(rec_mode)) lv_obj_clear_flag(id(offer_btn), LV_OBJ_FLAG_HIDDEN);
                if (pid == "record") {
                  id(recording) = true;
                  lv_label_set_text(id(mic_lbl), "■\nStop");
                  lv_obj_set_style_bg_color(id(mic_btn), lv_color_hex(${c_amber}), LV_PART_MAIN);
                } else if (pid == "stop") {
                  id(recording) = false; id(rec_phrase) = -1;
                  lv_label_set_text(id(mic_lbl), "●\nRecord");
                  lv_obj_set_style_bg_color(id(mic_btn), lv_color_hex(id(turn) == 0 ? ${c_sage} : ${c_steel}), LV_PART_MAIN);
                  lv_label_set_text((id(turn) == 0 && !id(rec_mode)) ? id(said_lbl) : id(heard_lbl), say.c_str());
                  if (id(rec_mode)) id(load_phrases).execute();      // the new take may add a ● to its phrase
                } else {
                  lv_label_set_text(id(said_lbl), say.c_str());
                }
          on_error:
            - lambda: |-
                lv_label_set_text(pid == "stop" || pid == "record" ? id(heard_lbl) : id(said_lbl), "Nano not reachable");

button:
  - platform: restart
    name: reboot
    id: reboot_btn
