              - button: {id: b3, grid_cell_column_pos: 2, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k3, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l3, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(2);"}}
              - button: {id: b4, grid_cell_column_pos: 0, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, pad_all: 6, widgets: [{label: {id: k4, align: TOP_LEFT, x: 4, y: 0, text_font: ui_14, text_color: "${c_muted}", text: ""}}, {label: {id: l4, align: CENTER, y: 4, width: 94%, long_mode: WRAP, text_align: CENTER, text_font: ui_22, text: ""}}], on_click: {lambda: "id(tap).execute(3);"}}
